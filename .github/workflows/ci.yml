name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build + lint: fast checks with no database dependency.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token has no reason to outlive this
          # step — checkout v6+ would otherwise leave it in a credentials file
          # wired into the job's git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The gate commands live in the Makefile — the single executable source
      # (the verifier runs the same targets via `make verify`).
      - run: make build
      - run: make crossbuild
      - run: make vet
      - name: gofmt
        run: make fmt-check

  # Helm chart: lint + render, and assert the rendered brain config is the exact
  # shape its consumer requires. The brain's LoadRoutes wants a JSON array of route
  # objects; a chart that renders the wrong shape crash-loops the brain at deploy
  # time, which unit tests can't see — so this check renders and validates it.
  helm:
    name: helm
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/managed-agent-platform
      VALUES: deploy/helm/managed-agent-platform/ci/example-values.yaml
      # The chart's second state (docs/plan/31_console-sso-rbac.md, #56): the
      # identity lane on, with the bundled IdP behind it. Layered ON TOP of
      # $VALUES, which supplies what the platform itself requires.
      IAM_VALUES: deploy/helm/managed-agent-platform/ci/iam-values.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token has no reason to outlive this
          # step — checkout v6+ would otherwise leave it in a credentials file
          # wired into the job's git config.
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint "$CHART" -f "$VALUES"
      - name: helm lint (identity lane + bundled IdP)
        run: helm lint "$CHART" -f "$VALUES" -f "$IAM_VALUES"
      - name: helm template renders (smoke)
        run: helm template t "$CHART" -f "$VALUES" > /dev/null
      - name: brain model-providers file is the JSON array the loader requires
        run: |
          mp="$(helm template t "$CHART" -f "$VALUES" --show-only templates/secret.yaml \
            | grep 'model-providers.json:' | awk '{print $2}' | tr -d '"' | base64 -d)"
          echo "$mp" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d, list) and d and all("model" in e for e in d), "model-providers.json must be a non-empty JSON array of route objects"; print("ok:", len(d), "route(s)")'
      - name: external-database path renders
        run: |
          helm template t "$CHART" -f "$VALUES" \
            --set postgresql.enabled=false \
            --set externalDatabase.url='postgres://u:p@db.example:5432/x?sslmode=require' > /dev/null
      - name: pre-created-bucket mode is off by default, complete when set, and refuses a region-less render
        run: |
          key() { grep "^  $1:" | awk '{print $2}' | tr -d '"' | base64 -d; }
          # The bundled MinIO starts empty, so the platform must still create
          # its bucket: the mode has to be off wherever it was not asked for.
          out="$(helm template t "$CHART" -f "$VALUES" --show-only templates/secret.yaml)"
          [ "$(echo "$out" | key blob-bucket-precreated)" = "false" ] \
            || { echo "default values must not opt into the pre-created-bucket mode" >&2; exit 1; }
          ext=(--set minio.enabled=false
               --set externalObjectStorage.endpoint=s3.example.internal:9000
               --set externalObjectStorage.accessKey=ci --set externalObjectStorage.secretKey=ci-secret
               --set externalObjectStorage.bucket=map-blob)
          out="$(helm template t "$CHART" -f "$VALUES" "${ext[@]}" \
            --set externalObjectStorage.region=us-east-1 \
            --set externalObjectStorage.bucketPrecreated=true --show-only templates/secret.yaml)"
          [ "$(echo "$out" | key blob-bucket-precreated)" = "true" ] \
            || { echo "bucketPrecreated did not reach the Secret" >&2; exit 1; }
          # ...and out of the Secret into the processes that build the store.
          # The secretKeyRef key is asserted, not just the variable name: the
          # reference is optional, so a key that names nothing renders exactly
          # like a correct one and leaves the variable unset — the mode silently
          # off for the deployment shape it exists to serve.
          for tpl in controlplane brain executor; do
            out="$(helm template t "$CHART" -f "$VALUES" "${ext[@]}" \
              --set externalObjectStorage.region=us-east-1 \
              --set externalObjectStorage.bucketPrecreated=true \
              --show-only "templates/$tpl-deployment.yaml")"
            echo "$out" | grep -A5 'name: BLOB_BUCKET_PRECREATED' | grep -q 'key: blob-bucket-precreated' \
              || { echo "$tpl does not read BLOB_BUCKET_PRECREATED from the blob-bucket-precreated key" >&2
                   echo "$out" | grep -A5 'name: BLOB_BUCKET_PRECREATED' >&2; exit 1; }
          done
          # Without a region the client resolves the bucket's location before
          # its first object request — the very bucket-level call the mode
          # exists to stop making — so this must fail the render, not deploy.
          err="$(helm template t "$CHART" -f "$VALUES" "${ext[@]}" \
            --set externalObjectStorage.bucketPrecreated=true 2>&1 >/dev/null)" \
            && { echo "bucketPrecreated without a region must fail the render" >&2; exit 1; }
          echo "$err" | grep -q 'bucketPrecreated requires region' \
            || { echo "the region-less render failed for the wrong reason: $err" >&2; exit 1; }
          echo "ok: pre-created-bucket mode"
      - name: the keyless GCS mode carries no credential and reaches all three processes
        run: |
          key() { grep "^  $1:" | awk '{print $2}' | tr -d '"' | base64 -d; }
          gcs=(--set minio.enabled=false --set gcsObjectStorage.enabled=true
               --set gcsObjectStorage.bucket=map-blob)
          out="$(helm template t "$CHART" -f "$VALUES" "${gcs[@]}" --show-only templates/secret.yaml)"
          [ "$(echo "$out" | key blob-backend)" = "gcs" ] \
            || { echo "blob-backend did not reach the Secret" >&2; exit 1; }
          [ "$(echo "$out" | key blob-bucket)" = "map-blob" ] \
            || { echo "blob-bucket did not reach the Secret" >&2; exit 1; }
          # The point of #240: no downloaded credential anywhere. A Secret that
          # still carried these would keep the thing the mode exists to delete,
          # and nothing else in the render would complain.
          #
          # Swept over the WHOLE release rather than the Secret alone. The claim
          # is that the mode ships no credential, and a Secret-scoped check reads
          # as proof of that while a value written straight into a Deployment
          # would sail past it in plaintext. So: no credential Secret key
          # anywhere, and no BLOB_* credential env taking a literal `value:`
          # instead of the optional secretKeyRef the helper emits.
          all="$(helm template t "$CHART" -f "$VALUES" "${gcs[@]}")"
          for k in blob-access-key blob-secret-key blob-endpoint; do
            echo "$all" | grep -q "^  $k:" \
              && { echo "the keyless GCS mode emitted $k" >&2; exit 1; }
          done
          for v in BLOB_ACCESS_KEY BLOB_SECRET_KEY BLOB_ENDPOINT; do
            echo "$all" | grep -A2 "name: $v\$" | grep -qE '^ *value:' \
              && { echo "the keyless GCS mode gave $v a literal value" >&2
                   echo "$all" | grep -A2 "name: $v\$" >&2; exit 1; }
          done
          # Out of the Secret and into every process that builds a store. The
          # secretKeyRef key is asserted, not just the variable name: the
          # reference is optional, so a key naming nothing renders exactly like a
          # correct one and leaves BLOB_BACKEND unset — which reads as "s3", and
          # then the platform looks for an endpoint that is not there.
          #
          # Both variables, because in this mode they are the whole
          # configuration and losing either is fatal rather than degrading:
          # internal/blob/backend fails a named backend with no bucket, so all
          # three processes CrashLoopBackOff. The names are anchored — an
          # unanchored BLOB_BUCKET also matches BLOB_BUCKET_PRECREATED, which
          # this mode never emits.
          for tpl in controlplane brain executor; do
            out="$(helm template t "$CHART" -f "$VALUES" "${gcs[@]}" --show-only "templates/$tpl-deployment.yaml")"
            for pair in BLOB_BACKEND:blob-backend BLOB_BUCKET:blob-bucket; do
              var="${pair%%:*}"; k="${pair##*:}"
              echo "$out" | grep -A5 "name: $var\$" | grep -q "key: $k\$" \
                || { echo "$tpl does not read $var from the $k key" >&2
                     echo "$out" | grep -A5 "name: $var\$" >&2; exit 1; }
            done
          done
          # Default values must not select it, or every existing install moves
          # backend on upgrade.
          out="$(helm template t "$CHART" -f "$VALUES" --show-only templates/secret.yaml)"
          echo "$out" | grep -q "^  blob-backend:" \
            && { echo "default values selected the GCS backend" >&2; exit 1; }
          # Ambiguity fails the render rather than picking one.
          for combo in "--set minio.enabled=false --set externalObjectStorage.endpoint=s3:9000 --set externalObjectStorage.accessKey=a --set externalObjectStorage.secretKey=b --set externalObjectStorage.bucket=c" ""; do
            err="$(helm template t "$CHART" -f "$VALUES" --set gcsObjectStorage.enabled=true \
              --set gcsObjectStorage.bucket=map-blob $combo 2>&1 >/dev/null)" \
              && { echo "GCS alongside another backend must fail the render" >&2; exit 1; }
            echo "$err" | grep -q 'mutually exclusive' \
              || { echo "the ambiguous render failed for the wrong reason: $err" >&2; exit 1; }
          done
          # A bucket is the whole configuration, so its absence is a refusal.
          err="$(helm template t "$CHART" -f "$VALUES" --set minio.enabled=false \
            --set gcsObjectStorage.enabled=true 2>&1 >/dev/null)" \
            && { echo "gcsObjectStorage without a bucket must fail the render" >&2; exit 1; }
          echo "$err" | grep -q 'requires bucket' \
            || { echo "the bucketless render failed for the wrong reason: $err" >&2; exit 1; }
          echo "ok: keyless GCS mode"
      - name: gate opt-in is off by default and complete when set
        run: |
          out="$(helm template t "$CHART" -f "$VALUES" --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -qE 'EXECUTOR_GATE_IMAGE|CONTROLPLANE_URL' && { echo "default values must not opt the executor into the gate" >&2; exit 1; }
          out="$(helm template t "$CHART" -f "$VALUES" --set executor.gateImage=reg/gate:v1 --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -q 'name: EXECUTOR_GATE_IMAGE' || { echo "gateImage did not set EXECUTOR_GATE_IMAGE" >&2; exit 1; }
          echo "$out" | grep -q 'name: CONTROLPLANE_URL' || { echo "gateImage did not set CONTROLPLANE_URL" >&2; exit 1; }
          echo "$out" | grep -q 'value: "http://t-managed-agent-platform-controlplane:8080"' || { echo "gateImage did not derive CONTROLPLANE_URL from the controlplane Service" >&2; exit 1; }
          err="$(helm template t "$CHART" -f "$VALUES" --set executor.gateImage=reg/gate:v1 --kube-version 1.26 2>&1 >/dev/null)" \
            && { echo "gateImage must fail the render on Kubernetes < 1.29 (native sidecars)" >&2; exit 1; }
          echo "$err" | grep -q 'executor.gateImage needs Kubernetes >= 1.29' \
            || { echo "the 1.26 render failed for the wrong reason: $err" >&2; exit 1; }
          echo "ok: gate opt-in paths"
      - name: sandbox hardening and RuntimeClass are off by default and complete when set
        run: |
          out="$(helm template t "$CHART" -f "$VALUES" --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -qE 'SANDBOX_PIDS_LIMIT|SANDBOX_CPU_MILLIS|SANDBOX_MEMORY_BYTES|SANDBOX_EPHEMERAL_STORAGE_BYTES|SANDBOX_CAP_DROP|SANDBOX_READONLY_ROOTFS|SANDBOX_RUN_AS_USER|SANDBOX_K8S_RUNTIME_CLASS|SANDBOX_K8S_NODE_SELECTOR|SANDBOX_K8S_TOLERATIONS|SANDBOX_K8S_IMAGE_PULL_SECRETS' \
            && { echo "default values must leave the executor's own hardening defaults alone" >&2; exit 1; }
          out="$(helm template t "$CHART" -f "$VALUES" \
            --set sandboxRuntimeClass.name=gvisor \
            --set executor.sandboxHardening.cpuMillis=1000 \
            --set executor.sandboxHardening.memoryBytes=1073741824 \
            --set executor.sandboxHardening.ephemeralStorageBytes=21474836480 \
            --set executor.sandboxHardening.capDrop=ALL \
            --set executor.sandboxHardening.readOnlyRootfs=true \
            --set executor.sandboxHardening.runAsUser=10001 \
            --show-only templates/executor-deployment.yaml)"
          for v in SANDBOX_K8S_RUNTIME_CLASS SANDBOX_CPU_MILLIS SANDBOX_MEMORY_BYTES SANDBOX_EPHEMERAL_STORAGE_BYTES SANDBOX_CAP_DROP SANDBOX_READONLY_ROOTFS SANDBOX_RUN_AS_USER; do
            echo "$out" | grep -q "name: $v" || { echo "$v was not rendered" >&2; exit 1; }
          done
          # The value, not only the name: a knob rendered with the wrong value is
          # a cap the operator did not ask for.
          echo "$out" | grep -A1 'name: SANDBOX_MEMORY_BYTES' | grep -q 'value: "1073741824"' \
            || { echo "memoryBytes did not reach the executor as configured" >&2; exit 1; }
          # Bytes, never a Kubernetes quantity string: the executor parses a
          # plain integer and fails startup on "20Gi", so a chart that helpfully
          # rendered a quantity would break every deployment that set the knob.
          echo "$out" | grep -A1 'name: SANDBOX_EPHEMERAL_STORAGE_BYTES' | grep -q 'value: "21474836480"' \
            || { echo "ephemeralStorageBytes did not reach the executor as raw bytes" >&2; exit 1; }
          # The same knobs again, this time through a values FILE — the path an
          # operator actually uses, and NOT the one `--set` exercises. Helm parses
          # `--set` into an int64 but an unquoted number in a file into a float64,
          # and a large float64 renders in scientific notation: memoryBytes
          # 21474836480 used to reach the executor as "2.147483648e+10", which it
          # rejects as malformed and refuses to start on. A --set-only assertion is
          # blind to that, which is how it shipped.
          cat > /tmp/hardening-values.yaml <<'YAML'
          executor:
            sandboxHardening:
              cpuMillis: 1000
              memoryBytes: 21474836480
              ephemeralStorageBytes: 1073741824
              runAsUser: 10001
          YAML
          fileOut="$(helm template t "$CHART" -f "$VALUES" -f /tmp/hardening-values.yaml \
            --show-only templates/executor-deployment.yaml)"
          for pair in 'SANDBOX_CPU_MILLIS 1000' 'SANDBOX_MEMORY_BYTES 21474836480' \
                      'SANDBOX_EPHEMERAL_STORAGE_BYTES 1073741824' 'SANDBOX_RUN_AS_USER 10001'; do
            set -- $pair
            echo "$fileOut" | grep -A1 "name: $1" | grep -q "value: \"$2\"" \
              || { echo "$1 from a values file did not render as a plain integer (scientific notation?)" >&2
                   echo "$fileOut" | grep -A1 "name: $1" >&2; exit 1; }
          done
          # ...and the other half of that fix: a FRACTIONAL value must NOT be
          # normalised. Rounding one turns malformed input into valid input —
          # `runAsUser: -0.4` would reach the executor as "-0", which parses as
          # uid 0 and runs every sandbox as root, where the value was supposed to
          # fail startup. It has to arrive as written so the executor refuses it.
          cat > /tmp/hardening-fractional.yaml <<'YAML'
          executor:
            sandboxHardening:
              cpuMillis: 2.5
              runAsUser: -0.4
          YAML
          fracOut="$(helm template t "$CHART" -f "$VALUES" -f /tmp/hardening-fractional.yaml \
            --show-only templates/executor-deployment.yaml)"
          for pair in 'SANDBOX_CPU_MILLIS 2.5' 'SANDBOX_RUN_AS_USER -0.4'; do
            set -- $pair
            echo "$fracOut" | grep -A1 "name: $1" | grep -q "value: \"$2\"" \
              || { echo "$1 was rounded instead of reaching the executor as written" >&2
                   echo "$fracOut" | grep -A1 "name: $1" >&2; exit 1; }
          done
          # Sandbox placement: the operator writes Kubernetes shapes (a map, a
          # list) and the chart encodes them into the two strings the executor
          # parses. Nothing else would notice the two sides drifting, so the
          # exact rendered encoding is asserted here and the same literals are
          # fed to the real parsers by TestTheChartsEncodingRoundTrips.
          cat > /tmp/placement-values.yaml <<'YAML'
          sandboxPlacement:
            nodeSelector:
              cloud.google.com/gke-nodepool: sandbox
              role: isolated
            tolerations:
              - key: sandbox
                operator: Equal
                value: "true"
                effect: NoSchedule
              - key: other
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 30
          YAML
          placeOut="$(helm template t "$CHART" -f "$VALUES" -f /tmp/placement-values.yaml \
            --show-only templates/executor-deployment.yaml)"
          # A map renders in sorted key order, so this string is stable.
          echo "$placeOut" | grep -A1 'name: SANDBOX_K8S_NODE_SELECTOR' \
            | grep -qF 'value: "cloud.google.com/gke-nodepool=sandbox,role=isolated"' \
            || { echo "the node selector did not render as sorted key=value pairs" >&2
                 echo "$placeOut" | grep -A1 'name: SANDBOX_K8S_NODE_SELECTOR' >&2; exit 1; }
          # The whole encoding, not one field: a substring check would pass a
          # template regression that dropped a toleration or restyled the JSON.
          # tolerationSeconds staying a JSON *number* is the part that matters
          # most. Stringified it does not silently become "unset" — the strict
          # decoder refuses it and the executor will not start — but that is a
          # deployment that stops working, which this catches at render instead.
          wantTol='value: "[{\"effect\":\"NoSchedule\",\"key\":\"sandbox\",\"operator\":\"Equal\",\"value\":\"true\"},{\"effect\":\"NoExecute\",\"key\":\"other\",\"operator\":\"Exists\",\"tolerationSeconds\":30}]"'
          echo "$placeOut" | grep -A1 'name: SANDBOX_K8S_TOLERATIONS' | grep -qF "$wantTol" \
            || { echo "tolerations did not render as the expected JSON encoding" >&2
                 echo "  want: $wantTol" >&2
                 echo "$placeOut" | grep -A1 'name: SANDBOX_K8S_TOLERATIONS' >&2; exit 1; }
          # The encoding's separators are `,` and `=`, so a label carrying one
          # would render as a different, still-valid selector the executor
          # accepts silently. The chart refuses at render time; these rows keep
          # that refusal, and the quoted-string rule beside it, from regressing.
          for bad in 'role: "1,y=2"' 'role: "a=b"' 'pool: 42'; do
            printf 'sandboxPlacement:\n  nodeSelector:\n    %s\n' "$bad" > /tmp/bad-placement.yaml
            if helm template t "$CHART" -f "$VALUES" -f /tmp/bad-placement.yaml \
                 --show-only templates/executor-deployment.yaml >/dev/null 2>&1; then
              echo "a nodeSelector of {$bad} rendered instead of failing" >&2; exit 1
            fi
          done
          # An explicit numeric/boolean zero means "turn this cap off" and must
          # reach the executor: Helm's `empty` is true of 0 and false, so the
          # obvious emptiness test would silently substitute the default.
          out="$(helm template t "$CHART" -f "$VALUES" \
            --set executor.sandboxHardening.cpuMillis=0 \
            --set executor.sandboxHardening.readOnlyRootfs=false \
            --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -A1 'name: SANDBOX_CPU_MILLIS' | grep -q 'value: "0"' \
            || { echo "an explicit cpuMillis=0 was dropped instead of turning the cap off" >&2; exit 1; }
          echo "$out" | grep -A1 'name: SANDBOX_READONLY_ROOTFS' | grep -q 'value: "false"' \
            || { echo "an explicit readOnlyRootfs=false was dropped" >&2; exit 1; }
          # The RuntimeClass object is opt-in on top of the name, and creating it
          # without one would leave the executor pointing at nothing.
          helm template t "$CHART" -f "$VALUES" | grep -q '^kind: RuntimeClass' \
            && { echo "the chart must not create a cluster-scoped RuntimeClass by default" >&2; exit 1; }
          helm template t "$CHART" -f "$VALUES" --set sandboxRuntimeClass.create=true \
            --set sandboxRuntimeClass.name=gvisor --show-only templates/sandbox-runtimeclass.yaml \
            | grep -q 'handler: "runsc"' || { echo "create=true did not render the RuntimeClass" >&2; exit 1; }
          helm template t "$CHART" -f "$VALUES" --set sandboxRuntimeClass.create=true >/dev/null 2>&1 \
            && { echo "create=true without a name must fail the render" >&2; exit 1; }
          echo "ok: sandbox hardening + RuntimeClass paths"
      - name: sandbox imagePullSecrets are off by default, inherit, and opt out
        run: |
          # Explicit list: the chart joins the names with `,`, the separator the
          # executor parses. The rendered literal is the same one
          # TestParseImagePullSecrets' "two names" row feeds the real parser, so
          # the two sides of the encoding cannot drift unnoticed.
          cat > /tmp/pullsecrets-values.yaml <<'YAML'
          sandboxImagePullSecrets:
            - name: regcred
            - name: ghcr-pull
          YAML
          out="$(helm template t "$CHART" -f "$VALUES" -f /tmp/pullsecrets-values.yaml \
            --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -A1 'name: SANDBOX_K8S_IMAGE_PULL_SECRETS' | grep -qF 'value: "regcred,ghcr-pull"' \
            || { echo "sandboxImagePullSecrets did not render as comma-joined names" >&2
                 echo "$out" | grep -A1 'name: SANDBOX_K8S_IMAGE_PULL_SECRETS' >&2; exit 1; }
          # Null inherits the top-level imagePullSecrets: an operator who told
          # the platform's pods how to reach the registry means the sandbox
          # pods too, and they run in the release namespace where the same
          # Secrets answer.
          out="$(helm template t "$CHART" -f "$VALUES" --set 'imagePullSecrets[0].name=regcred' \
            --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -A1 'name: SANDBOX_K8S_IMAGE_PULL_SECRETS' | grep -qF 'value: "regcred"' \
            || { echo "an unset sandboxImagePullSecrets did not inherit imagePullSecrets" >&2; exit 1; }
          # ...and an explicit [] opts sandbox pods out without touching the
          # platform pods' own pull secrets. A values file, not --set: `--set
          # 'x=[]'` assigns the STRING "[]", which is exactly the unset-vs-empty
          # distinction this path exists to honor.
          cat > /tmp/optout-values.yaml <<'YAML'
          imagePullSecrets:
            - name: regcred
          sandboxImagePullSecrets: []
          YAML
          out="$(helm template t "$CHART" -f "$VALUES" -f /tmp/optout-values.yaml \
            --show-only templates/executor-deployment.yaml)"
          echo "$out" | grep -q 'SANDBOX_K8S_IMAGE_PULL_SECRETS' \
            && { echo "an explicit [] must render no SANDBOX_K8S_IMAGE_PULL_SECRETS" >&2; exit 1; }
          # `,` separates entries, so a name carrying one would render as two
          # plausible names the executor accepts silently; a nameless entry has
          # nothing to render at all. Both refuse at render time.
          for bad in '- name: "a,b"' '- named: regcred'; do
            printf 'sandboxImagePullSecrets:\n  %s\n' "$bad" > /tmp/bad-pullsecrets.yaml
            if helm template t "$CHART" -f "$VALUES" -f /tmp/bad-pullsecrets.yaml \
                 --show-only templates/executor-deployment.yaml >/dev/null 2>&1; then
              echo "a sandboxImagePullSecrets entry of {$bad} rendered instead of failing" >&2; exit 1
            fi
          done
          # A non-list root would read as the [] opt-out through `with` — a
          # mistyped "" or {} must refuse at render, not silently drop the env.
          for bad in '""' '{}'; do
            printf 'sandboxImagePullSecrets: %s\n' "$bad" > /tmp/bad-pullsecrets.yaml
            if helm template t "$CHART" -f "$VALUES" -f /tmp/bad-pullsecrets.yaml \
                 --show-only templates/executor-deployment.yaml >/dev/null 2>&1; then
              echo "a sandboxImagePullSecrets root of $bad rendered instead of failing" >&2; exit 1
            fi
          done
          echo "ok: sandbox imagePullSecrets paths"
      - name: existingSecret path renders (chart creates no Secret)
        run: |
          out="$(helm template t "$CHART" -f "$VALUES" \
            --set postgresql.enabled=false --set minio.enabled=false \
            --set openbao.enabled=false \
            --set existingSecret=my-preexisting)"
          echo "$out" | grep -q 'name: my-preexisting' || { echo "expected Deployments to reference existingSecret" >&2; exit 1; }
          echo "$out" | grep -q '^kind: Secret' && { echo "chart must not create a Secret when existingSecret is set" >&2; exit 1; }
          echo "ok: existingSecret path"
      - name: external-openbao and local-cipher paths render
        run: |
          helm template t "$CHART" -f "$VALUES" \
            --set openbao.enabled=false \
            --set externalOpenBao.address='https://bao.example.internal:8200' \
            --set externalOpenBao.token=ci-placeholder \
            --show-only templates/secret.yaml | grep -q 'bao-addr:' \
            || { echo "expected the external-openbao Secret keys" >&2; exit 1; }
          helm template t "$CHART" -f "$VALUES" \
            --set openbao.enabled=false \
            --set localCipher.masterKey='Y2ktcGxhY2Vob2xkZXItc3RhdGljLXNlYWwta2V5ISE=' \
            --show-only templates/secret.yaml | grep -q 'secrets-master-key:' \
            || { echo "expected the local-cipher Secret keys" >&2; exit 1; }
          if helm template t "$CHART" -f "$VALUES" \
               --set externalOpenBao.address='https://bao.example.internal:8200' \
               --set externalOpenBao.token=ci-placeholder > /dev/null 2>&1; then
            echo "expected the bundled-vs-external ambiguity guard to fail the render" >&2; exit 1
          fi
          if helm template t "$CHART" -f "$VALUES" \
               --set localCipher.masterKey='Y2ktcGxhY2Vob2xkZXItc3RhdGljLXNlYWwta2V5ISE=' > /dev/null 2>&1; then
            echo "expected the openbao-vs-localCipher ambiguity guard to fail the render" >&2; exit 1
          fi
          echo "ok: cipher paths (positive and guards)"
      - name: gcpkms cipher path renders (and its guards fire)
        run: |
          KEY=projects/p/locations/global/keyRings/r/cryptoKeys/k
          out="$(helm template t "$CHART" -f "$VALUES" \
            --set openbao.enabled=false --set "gcpKMS.keyName=$KEY")"
          # The value is base64 in the Secret, so decode it: a substring check
          # against the encoded blob would pass on a truncated or re-encoded
          # name, which is precisely the failure that would strand every
          # credential write behind a key the service does not hold.
          got="$(echo "$out" | awk '/^  gcpkms-key-name:/ { gsub(/"/, "", $2); print $2 }' | base64 -d)"
          [ "$got" = "$KEY" ] \
            || { echo "gcpkms-key-name decoded to '${got:-<none>}', want '$KEY'" >&2; exit 1; }
          echo "$out" | grep -q 'secrets-backend: "Z2Nwa21z"' \
            || { echo "expected secrets-backend to be gcpkms (base64 Z2Nwa21z)" >&2; exit 1; }
          # Both processes that hold the cipher must receive the name, and must
          # read it from the Secret key the Secret actually writes. Asserting
          # only that the env var exists would pass a secretKeyRef pointing at a
          # key nothing renders — the variable would simply arrive unset
          # (optional: true) and the process would run cipher-less, silently.
          # So the assertion is the env NAME and its KEY together.
          for t in controlplane executor; do
            rendered="$(helm template t "$CHART" -f "$VALUES" --set openbao.enabled=false \
              --set "gcpKMS.keyName=$KEY" --show-only "templates/$t-deployment.yaml")"
            echo "$rendered" | grep -A4 'name: GCPKMS_KEY_NAME' | grep -q 'key: gcpkms-key-name' \
              || { echo "$t does not read GCPKMS_KEY_NAME from the gcpkms-key-name Secret key" >&2
                   echo "$rendered" | grep -A4 'name: GCPKMS_KEY_NAME' >&2; exit 1; }
          done
          # The brain holds no cipher, so it must never receive the key name. It
          # DOES have a ServiceAccount of its own now (#269 — the Cloud SQL Auth
          # Proxy path needs an identity), and that account being its own is the
          # protection: the loop below asserts each Deployment uses the KSA
          # named after it, so no annotation can quietly point the brain at the
          # control plane's KMS identity.
          brain="$(helm template t "$CHART" -f "$VALUES" --set openbao.enabled=false \
            --set "gcpKMS.keyName=$KEY" --show-only templates/brain-deployment.yaml)"
          echo "$brain" | grep -q 'GCPKMS_KEY_NAME' \
            && { echo "the brain holds no cipher and must not receive the KMS key name" >&2; exit 1; }
          # Workload Identity is an annotation and nothing else, so a chart that
          # silently dropped it would leave ADC with no identity and every
          # credential write failing at runtime with nothing rendered to blame.
          for t in controlplane brain executor; do
            tpl="templates/$t-serviceaccount.yaml"
            [ "$t" = executor ] && tpl=templates/executor-rbac.yaml
            helm template t "$CHART" -f "$VALUES" \
              --set "$t.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=map@p.iam.gserviceaccount.com" \
              --show-only "$tpl" \
              | grep -q 'iam.gke.io/gcp-service-account: map@p.iam.gserviceaccount.com' \
              || { echo "the $t ServiceAccount dropped its annotations" >&2; exit 1; }
          done
          # An annotated ServiceAccount the Deployment does not USE grants
          # nothing, and that mismatch renders perfectly: assert the binding
          # between the two, not just that each exists.
          for t in controlplane brain executor; do
            sa="$(helm template t "$CHART" -f "$VALUES" --show-only "templates/$t-deployment.yaml" \
              | awk '$1 == "serviceAccountName:" { print $2; exit }')"
            [ "$sa" = "t-managed-agent-platform-$t" ] \
              || { echo "$t Deployment serviceAccountName is '${sa:-<none>}', want t-managed-agent-platform-$t" >&2; exit 1; }
          done
          # A CryptoKeyVersion is the expensive typo: Encrypt accepts one and
          # Decrypt refuses it, so a release configured with one seals
          # credentials it can never unseal. Refused at render, not at runtime.
          # The same rows internal/secrets/gcpkms's
          # TestTheChartAndTheCipherAgreeOnKeyNames feeds to the real
          # constructor, so the template's expression and the executor's cannot
          # drift apart unnoticed. The last two are Cloud KMS's own id syntax
          # for the ring and key segments (`[a-zA-Z0-9_-]{1,63}`).
          for bad in \
            "$KEY/cryptoKeyVersions/1" \
            projects/p/locations/global/keyRings/r \
            my-key \
            'projects/p/locations/global/keyRings/has space/cryptoKeys/k' \
            projects/p/locations/global/keyRings/r/cryptoKeys/has.dot; do
            if helm template t "$CHART" -f "$VALUES" --set openbao.enabled=false \
                 --set "gcpKMS.keyName=$bad" >/dev/null 2>&1; then
              echo "gcpKMS.keyName='$bad' rendered instead of failing" >&2; exit 1
            fi
          done
          # Two ciphers at once is ambiguous; the bundled OpenBao is on by
          # default, so this is the mistake a GCP operator actually makes.
          if helm template t "$CHART" -f "$VALUES" --set "gcpKMS.keyName=$KEY" >/dev/null 2>&1; then
            echo "gcpKMS.keyName alongside the bundled OpenBao rendered instead of failing" >&2; exit 1
          fi
          echo "ok: gcpkms cipher path"
      - name: Cloud SQL Auth Proxy sidecar is off by default and complete when set
        run: |
          # Captured into a variable rather than piped straight into grep,
          # because a render that FAILS also matches nothing: piped, the one
          # arrangement this line exists to catch — the proxy defaulted on,
          # which the bundled-Postgres guard then refuses — would read as
          # "absent, ok". Assigned, `set -e` fails the step on it instead.
          out="$(helm template t "$CHART" -f "$VALUES")"
          echo "$out" | grep -q 'cloud-sql-proxy' \
            && { echo "default values must not add the Cloud SQL Auth Proxy sidecar" >&2; exit 1; }
          on=(--set postgresql.enabled=false
              --set externalDatabase.url='postgres://u:p@127.0.0.1:5432/x?sslmode=disable'
              --set cloudSQLProxy.enabled=true
              --set cloudSQLProxy.instanceConnectionName=proj:us-central1:inst)
          # All THREE database-opening deployments get it, and that is not
          # symmetry for its own sake: they read one `database-url` Secret key,
          # so a DSN naming the proxy's loopback socket is wrong for any pod
          # that did not get a proxy.
          for t in controlplane brain executor; do
            rendered="$(helm template t "$CHART" -f "$VALUES" "${on[@]}" --show-only "templates/$t-deployment.yaml")"
            # Every assertion below reads the proxy's own entry under
            # `initContainers:`, not the whole manifest and not the whole block,
            # and both halves of that are load-bearing. Manifest-wide, a proxy
            # rendered under `containers:` — losing the ordering guarantee
            # entirely, since an ordinary container lets the process race it and
            # crash-loop on a socket that is not listening yet — leaves every
            # grep still matching something. Block-wide, a SECOND init container
            # supplies whatever the proxy's entry lost. So the extraction is
            # anchored to `- name: cloud-sql-proxy` at the exact indentation a
            # podSpec gives it, and ends at the next entry.
            sidecar="$(echo "$rendered" | awk '
              /^      initContainers:$/ { inInit = 1; next }
              inInit && /^      [a-zA-Z]/ { inInit = 0 }
              inInit && /^        - name: / { inProxy = ($0 == "        - name: cloud-sql-proxy") }
              inInit && inProxy { print }')"
            [ -n "$sidecar" ] \
              || { echo "$t: the proxy is not a native sidecar under initContainers" >&2
                   echo "$rendered" >&2; exit 1; }
            echo "$sidecar" | grep -q 'restartPolicy: Always' \
              || { echo "$t: the sidecar is missing restartPolicy: Always" >&2; exit 1; }
            # Without a startupProbe a native sidecar promises only that the
            # process was started, not that it is listening — and the probe in
            # turn is only reachable because of the three health flags, so
            # asserting the probe without them would certify a sidecar whose
            # startup can never succeed and whose pod therefore never starts its
            # application container at all. Both probes are asserted: a liveness
            # probe pointed at nothing has the kubelet restart a healthy proxy
            # on a loop.
            for path in /startup /liveness; do
              echo "$sidecar" | grep -q "path: $path" \
                || { echo "$t: the sidecar has no probe on $path" >&2; exit 1; }
            done
            # ...and the probes must agree with the health server on a PORT.
            # Asserting the flag and the probe path separately still passes a
            # probe polling a port the proxy never binds, which is the same
            # never-starts-the-application failure with a different cause — so
            # the agreement is what gets asserted, not the two halves.
            httpPort="$(echo "$sidecar" | sed -n 's/.*"--http-port=\([0-9][0-9]*\)".*/\1/p')"
            [ -n "$httpPort" ] \
              || { echo "$t: no --http-port in the sidecar args" >&2; exit 1; }
            mismatched="$(echo "$sidecar" | awk -v p="$httpPort" '$1 == "port:" && $2 != p { print $2 }')"
            [ -z "$mismatched" ] \
              || { echo "$t: a probe polls port $mismatched, the health server binds $httpPort" >&2; exit 1; }
            # The whole `sslmode=disable` safety argument is that the socket is
            # on loopback, which holds because the proxy defaults to 127.0.0.1
            # and the chart passes no --address. An --address flag would move it
            # onto the pod network without changing anything else visible here.
            echo "$sidecar" | grep -q '"--address' \
              && { echo "$t: an --address flag would take the socket off loopback" >&2; exit 1; }
            # --http-port is deliberately absent from this list: the
            # port-agreement assertion below covers it, and pinning the literal
            # here would fail a coherent move of the flag and both probes to
            # another port — a change with no defect in it.
            for want in '"--health-check"' '"--http-address=0.0.0.0"' \
                        '"--private-ip"' '"--port=5432"' '"--structured-logs"' \
                        '"proj:us-central1:inst"'; do
              echo "$sidecar" | grep -qF "$want" \
                || { echo "$t: the sidecar args are missing $want" >&2; exit 1; }
            done
          done
          # --private-ip is what an ipv4_enabled=false instance needs and is
          # wrong for one reached over its public address, so the switch has to
          # actually remove it. Captured, not piped, for the reason at the top of
          # this step: piped, a render that failed for any other reason would
          # match nothing and read as "removed, ok".
          noPrivate="$(helm template t "$CHART" -f "$VALUES" "${on[@]}" \
            --set cloudSQLProxy.privateIP=false --show-only templates/brain-deployment.yaml)"
          echo "$noPrivate" | grep -qF '"--private-ip"' \
            && { echo "privateIP=false left --private-ip in the args" >&2; exit 1; }
          # The four render-time refusals. Each is asserted by its own MESSAGE,
          # not merely by a non-zero exit: several of these values would be
          # refused by more than one guard, so an exit code cannot tell which
          # fired — deleting the required-name guard left this step green when it
          # only checked that the render failed, because the shape guard refuses
          # an empty name too. Each of them is a pod that would otherwise deploy
          # and never become ready, with nothing in the release naming why.
          refuses() {
            local want="$1"; shift
            local err
            err="$(helm template t "$CHART" -f "$VALUES" "$@" 2>&1 >/dev/null)" \
              && { echo "rendered instead of failing: $*" >&2; exit 1; }
            echo "$err" | grep -qF "$want" \
              || { echo "refused for the wrong reason (wanted: $want)" >&2
                   echo "$err" >&2; exit 1; }
          }
          noDB=(--set postgresql.enabled=false --set externalDatabase.url='postgres://u:p@127.0.0.1:5432/x')
          refuses 'cloudSQLProxy.instanceConnectionName is required' \
            "${noDB[@]}" --set cloudSQLProxy.enabled=true
          # An address, an empty segment, and too many segments. The first is
          # the substitution an operator actually makes — `sql_private_ip` or a
          # host:port pasted where the connection name belongs; the rest are
          # what a bare "at least three colon-separated parts" test accepted.
          # This is a SHAPE check and these rows are its boundary: a
          # well-formed-but-wrong name (`127.0.0.1:5432:x` is three non-empty
          # parts) is the proxy's to reject at startup, and encoding Google's
          # own rules for the three parts here would refuse a valid name the day
          # Google widens one.
          for bad in 10.1.2.3 127.0.0.1:5432 'a::b' 'proj:us-central1:' '2001:db8::1' 'a:b:c:d:e'; do
            refuses 'must be an instance connection name' \
              "${noDB[@]}" --set cloudSQLProxy.enabled=true \
              --set "cloudSQLProxy.instanceConnectionName=$bad"
          done
          # ...but a legacy domain-scoped project really does carry a fourth
          # segment, so the shape check must not refuse one.
          domainScoped="$(helm template t "$CHART" -f "$VALUES" "${on[@]}" \
            --set 'cloudSQLProxy.instanceConnectionName=google.com:proj:us-central1:inst' \
            --show-only templates/brain-deployment.yaml)"
          echo "$domainScoped" | grep -qF '"google.com:proj:us-central1:inst"' \
            || { echo "a domain-scoped project's connection name was refused or mangled" >&2; exit 1; }
          refuses 'cloudSQLProxy.enabled is incompatible with postgresql.enabled' \
            --set cloudSQLProxy.enabled=true --set cloudSQLProxy.instanceConnectionName=proj:us-central1:inst
          refuses 'cloudSQLProxy.enabled needs Kubernetes >= 1.29' \
            "${on[@]}" --kube-version 1.26
          echo "ok: Cloud SQL Auth Proxy paths"
      - name: bundled MinIO gates readiness on its object layer
        # Both assertions read rendered `path:` keys rather than grepping the
        # template for a substring: a substring match also reads the comment
        # that explains the choice, so documenting the rejected endpoint there
        # would fail the job.
        run: |
          rendered="$(helm template t "$CHART" -f "$VALUES" --show-only templates/minio.yaml)"
          p="$(echo "$rendered" | awk '/readinessProbe:/ { probe = 1 } probe && $1 == "path:" { print $2; exit }')"
          [ "$p" = "/minio/health/cluster" ] \
            || { echo "MinIO's readinessProbe must gate on /minio/health/cluster (#216); rendered: ${p:-<none>}" >&2; exit 1; }
          echo "$rendered" | awk '$1 == "path:" && $2 == "/minio/health/ready" { exit 1 }' \
            || { echo "/minio/health/ready answers 200 before the object layer can serve S3; no probe may gate on it (#216)" >&2; exit 1; }
          echo "ok: minio readiness probe is $p"
      - name: the identity lane is off by default and complete when set
        # Off by default has a stronger meaning here than "no behaviour change":
        # IDENTITY_MODE unset and IDENTITY_MODE=disabled are ONE state to
        # internal/identity, so rendering the pair explicitly would change every
        # existing release's controlplane pod spec — and roll its pods on upgrade
        # — to say something the platform already assumed.
        run: |
          helm template t "$CHART" -f "$VALUES" | grep -q 'IDENTITY_' \
            && { echo "default values must render no IDENTITY_* env at all" >&2; exit 1; }
          # Only the control plane has a human lane. The brain and the executor
          # never see a user token, so handing them the issuer, the audience and
          # the role map would be configuration with no reader.
          for tpl in brain executor; do
            helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only "templates/$tpl-deployment.yaml" \
              | grep -q 'IDENTITY_' \
              && { echo "$tpl has no identity lane and must not receive its configuration" >&2; exit 1; }
          done
          # A mode with no role map renders a control plane that cannot boot:
          # parseRoleMap refuses an empty IDENTITY_ROLE_MAP, FromEnv propagates it
          # and the process exits, so the MACHINE lanes go down with the human one.
          # Refused at render, like every other value whose absence is fatal.
          err="$(helm template t "$CHART" -f "$VALUES" --set identity.mode=oidc \
            --set identity.oidc.issuer=https://idp.ci.example \
            --set identity.oidc.audience=map-console 2>&1 >/dev/null)" \
            && { echo "identity.mode with an empty roleMap must fail the render" >&2; exit 1; }
          echo "$err" | grep -q 'identity.roleMap must map at least one claim value' \
            || { echo "the empty-roleMap render failed for the wrong reason: $err" >&2; exit 1; }
          out="$(helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only templates/controlplane-deployment.yaml)"
          # The variable NAME and its VALUE together: these names are read verbatim
          # by internal/identity/config.go and nothing else in the release would
          # notice a misspelled one — an unread variable leaves the lane disabled,
          # which is a deployment that authenticates nobody and looks fine.
          for pair in 'IDENTITY_MODE oidc' 'IDENTITY_OIDC_ISSUER https://idp.ci.example' \
                      'IDENTITY_OIDC_AUDIENCE map-console' 'IDENTITY_CLAIM_ROLES groups'; do
            set -- $pair
            echo "$out" | grep -A1 "name: $1\$" | grep -q "value: \"$2\"" \
              || { echo "$1 did not reach the control plane as $2" >&2
                   echo "$out" | grep -A1 "name: $1\$" >&2; exit 1; }
          done
          # IDENTITY_CLAIM_ROLES is the one whose wrong value fails silently in
          # the worst direction: Casdoor's `roles` claim carries role OBJECTS and
          # the platform collects only strings out of a claim, so the default maps
          # every human to no role — everyone authenticates, nobody is authorized.
          # `groups` is asserted above because the bundle depends on it.
          #
          # The role map is the one value the chart ENCODES rather than passes
          # through — a YAML map into the flat `value=role,...` the verifier
          # parses, sorted by claim value the way `range` over a map renders.
          # Nothing else would notice the two sides drifting.
          want='value: "map/platform-admins=admin,map/platform-devs=developer,map/platform-read=viewer"'
          echo "$out" | grep -A1 'name: IDENTITY_ROLE_MAP' | grep -qF "$want" \
            || { echo "the role map did not render as the encoding the verifier parses" >&2
                 echo "  want: $want" >&2
                 echo "$out" | grep -A1 'name: IDENTITY_ROLE_MAP' >&2; exit 1; }
          # `,` and `=` are that encoding's separators, so a claim value carrying
          # one would render as a DIFFERENT, still-valid map the verifier accepts
          # without complaint — a silent authority change. A non-string role is
          # refused for the reason the node selector refuses one: a values file
          # decodes an unquoted number as float64.
          for bad in '"a,b": admin' '"a=b": admin' 'group: 42'; do
            printf 'identity:\n  mode: oidc\n  oidc:\n    issuer: https://idp.example\n    audience: x\n  roleMap:\n    %s\n' "$bad" > /tmp/bad-rolemap.yaml
            if helm template t "$CHART" -f "$VALUES" -f /tmp/bad-rolemap.yaml >/dev/null 2>&1; then
              echo "a roleMap entry of {$bad} rendered instead of failing" >&2; exit 1
            fi
          done
          echo "ok: identity lane"
      - name: the bundled IdP refuses the SAML and CAS surfaces, and nothing else reaches it
        # The other half of the bundle's hardening posture: the "ships no default
        # credential" step below owns the seed and its credentials, this one owns
        # the way in. VU#780781 is a cluster of Casdoor CVEs,
        # five of them on the SAML service-provider path, and none of them can be
        # configured away: routers/router.go registers those routes whatever is
        # set, and one process serves the API and the login UI from one port, so
        # "keep it internal" is not available as a control. What is available is
        # an Ingress that routes those paths nowhere and a NetworkPolicy that
        # leaves the Ingress as the only way to the pod — which is a control only
        # while BOTH render.
        run: |
          refuses() {
            local want="$1"; shift
            local err
            err="$(helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" "$@" 2>&1 >/dev/null)" \
              && { echo "rendered instead of failing: $*" >&2; exit 1; }
            echo "$err" | grep -qF "$want" \
              || { echo "refused for the wrong reason (wanted: $want)" >&2; echo "$err" >&2; exit 1; }
          }
          # The refusals are READ OUT of the compose proxy's config rather than
          # restated here. The two enforcement points are a Caddyfile and an
          # Ingress, nothing else joins them, and a rule added to one and not the
          # other is exactly the gap the advisory makes expensive.
          want="$(sed -n 's|^[[:space:]]*@saml path ||p' deploy/compose/idp-proxy.Caddyfile \
            | tr ' ' '\n' | sed 's|/\*$||' | sort)"
          [ -n "$want" ] || { echo "no '@saml path' line in deploy/compose/idp-proxy.Caddyfile" >&2; exit 1; }
          # Anchored to the Ingress document AND to the deny backend: what matters
          # is the paths routed AWAY from Casdoor, and a bare path list would pass
          # on rules pointing back at it.
          got="$(helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only templates/casdoor-ingress.yaml \
            | awk '/^kind: Ingress$/ { ing = 1 }
                   ing && $1 == "-" && $2 == "path:" { p = $3 }
                   ing && /-casdoor-deny$/ { print p }' | tr -d '"' | sort)"
          [ "$want" = "$got" ] \
            || { echo "the Ingress does not deny exactly the paths the compose proxy refuses" >&2
                 echo "  caddyfile: $(echo "$want" | tr '\n' ' ')" >&2
                 echo "  ingress  : $(echo "$got" | tr '\n' ' ')" >&2; exit 1; }
          # ...and the deny backend must stay a Service nothing can serve. Given a
          # selector it would resolve to pods and every refusal above would become
          # a route.
          helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only templates/casdoor-ingress.yaml \
            | awk '/-casdoor-deny$/ { svc = 1 } svc && $1 == "selector:" { exit 1 }' \
            || { echo "the deny Service must have no selector" >&2; exit 1; }
          np="$(helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only templates/casdoor-networkpolicy.yaml)"
          echo "$np" | grep -q '^kind: NetworkPolicy$' \
            || { echo "the bundled IdP must ship its NetworkPolicy" >&2; exit 1; }
          # Anchored INSIDE spec.podSelector, not anywhere in the document: the
          # same component label sits in metadata.labels, so a bare grep stayed
          # green with the selector deleted — and a NetworkPolicy whose selector
          # is empty applies to every pod in the namespace, which is a different
          # policy than the one this asserts.
          echo "$np" | awk '/^  podSelector:/ { f = 1; next } /^  [a-z]/ { f = 0 } f' \
            | grep -q 'app.kubernetes.io/component: casdoor' \
            || { echo "the NetworkPolicy's podSelector does not select the IdP pod" >&2
                 echo "$np" >&2; exit 1; }
          # An EMPTY `from` means "all sources" to Kubernetes, so the one shape
          # that must never render is the one that looks exactly like this policy
          # and admits everything.
          refuses 'must name at least one peer' --set-json 'casdoor.networkPolicy.from=[]'
          dep="$(helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only templates/casdoor.yaml)"
          echo "$dep" | grep -q 'type: ClusterIP' \
            || { echo "the IdP Service must be ClusterIP" >&2; exit 1; }
          echo "$dep" | grep -qE 'type: (NodePort|LoadBalancer)' \
            && { echo "the IdP Service must never be NodePort or LoadBalancer — that is a second entrance with none of the deny rules on it" >&2; exit 1; }
          # `origin` is the `iss` claim of every token Casdoor mints and the
          # verifier compares `iss` exactly, so it must be the ingress host — and
          # https, the only scheme the platform accepts for an issuer or a key set.
          echo "$dep" | grep -A1 'name: origin$' | grep -q 'value: "https://idp.ci.example"' \
            || { echo "origin is not https://<casdoor.ingress.host>" >&2
                 echo "$dep" | grep -A1 'name: origin$' >&2; exit 1; }
          refuses "must equal the bundled IdP's origin" --set 'identity.oidc.issuer=https://wrong.example'
          refuses 'casdoor.ingress.host is required' --set 'casdoor.ingress.host='
          cm="$(helm template t "$CHART" -f "$VALUES" -f "$IAM_VALUES" --show-only templates/casdoor-init-data-secret.yaml)"
          # tokenFormat JWT: the alternative, JWT-Standard, drops `roles`,
          # `permissions` and `groups` from the token entirely, which would leave
          # IDENTITY_ROLE_MAP nothing to map and every human no role.
          echo "$cm" | grep -q '"tokenFormat": "JWT"' \
            || { echo "the seeded application must mint JWT (not JWT-Standard) tokens" >&2; exit 1; }
          # The grant CVE-2026-9097 (9.8, a revoked JWT accepted) lives on, and
          # self-service signup into the provider that guards the platform.
          echo "$cm" | grep -q 'token-exchange' \
            && { echo "the token-exchange grant must not be enabled" >&2; exit 1; }
          echo "$cm" | grep -q '"enableSignUp": false' \
            || { echo "public signup must be off" >&2; exit 1; }
          # Casdoor needs a database of its own; with the bundled Postgres off the
          # chart has nothing to derive a DSN from, and says so rather than
          # rendering an IdP that cannot start.
          refuses 'casdoor.database.dataSourceName is required' \
            --set postgresql.enabled=false \
            --set externalDatabase.url='postgres://u:p@db.example:5432/x?sslmode=require'
          # Deploying the IdP first and wiring the identity lane second is a
          # supported order, so an unconfigured lane must not fail that render.
          helm template t "$CHART" -f "$VALUES" --set casdoor.enabled=true \
            --set casdoor.adminPassword=x --set casdoor.console.clientSecret=y \
            --set 'casdoor.console.redirectURIs[0]=https://console.example/callback' \
            --set casdoor.ingress.host=idp.example > /dev/null \
            || { echo "casdoor.enabled with identity.mode empty must render" >&2; exit 1; }
          echo "ok: the IdP's refusals and its single entrance"
      - name: required-value guard fires (missing controlplane.apiKey)
        run: |
          if helm template t "$CHART" --set image.tag=x \
               --set-json 'brain.modelProviders=[{"model":"*"}]' > /dev/null 2>&1; then
            echo "expected the missing-apiKey guard to fail the render" >&2; exit 1
          fi
          echo "ok: guard fired"
      - name: the CD values file renders, and its sandbox placement survives the render
        # deploy/gcp/staging-values.yaml is the file `.github/workflows/deploy.yml`
        # installs with, and the chart ships no values.schema.json — so a
        # misspelled top-level key is not an error, it is a key nothing reads.
        # `sandboxPlacment:` renders green and every sandbox pod then sits Pending
        # forever behind a taint nothing tolerates, discovered at the first
        # session rather than here.
        #
        # Rendered ALONE, without $VALUES. That file is mode 2 — `existingSecret`
        # is set, so the chart writes no Secret and demands no credential value:
        # the dummy --set arguments every other step in this job needs are, here,
        # none at all. Merging the CI example values on top would render too, and
        # would prove something else.
        run: |
          out="$(helm template t "$CHART" -f deploy/gcp/staging-values.yaml \
            --show-only templates/executor-deployment.yaml)"
          # The label, not the variable name: the chart emits both variables from
          # `sandboxPlacement`, so a typo in the key leaves them absent — and an
          # unanchored name check would also pass on a selector pointing at some
          # other pool.
          echo "$out" | grep -A1 'name: SANDBOX_K8S_NODE_SELECTOR' | grep -qF 'map.opensdlc.dev/sandbox=true' \
            || { echo "staging-values.yaml did not reach the executor as a sandbox nodeSelector" >&2
                 echo "$out" | grep -A1 'name: SANDBOX_K8S_NODE_SELECTOR' >&2; exit 1; }
          # The toleration is the other half of the pair and fails differently:
          # without it the selector finds the pool and the taint refuses the pod.
          echo "$out" | grep -A1 'name: SANDBOX_K8S_TOLERATIONS' | grep -qF 'map.opensdlc.dev/sandbox' \
            || { echo "staging-values.yaml did not reach the executor as a sandbox toleration" >&2
                 echo "$out" | grep -A1 'name: SANDBOX_K8S_TOLERATIONS' >&2; exit 1; }
          echo "ok: CD values file renders with both halves of the sandbox pair"
      - name: the CD job and the chart agree on the mode-2 Secret's keys
        # Mode 2 splits one contract across two files nothing joins. The deploy
        # job writes seven FILES into a temp dir and `kubectl create secret
        # --from-file` turns each file NAME into a Secret key; the chart reads
        # keys by name. Rename either side and nothing fails loudly: the keys
        # `map.blobEnv` and `map.secretsEnv` emit are `optional: true`, so the
        # pod starts and reads the chart's default instead — BLOB_BACKEND falls
        # back to "s3" and the platform looks for an S3 endpoint that is not
        # there, against a GCS bucket.
        #
        # The key list is read out of `deploy.yml` rather than restated here, so
        # a key added to the job that nothing reads fails this step too.
        run: |
          set -euo pipefail
          wrote="$(grep -oE -- '--from-file="\$d/[^"]+"' .github/workflows/deploy.yml \
            | sed 's|.*/||; s|"$||' | sort -u)"
          [ "$(echo "$wrote" | wc -l)" -eq 7 ] \
            || { echo "expected 7 --from-file keys in deploy.yml, found:" >&2
                 echo "$wrote" >&2; exit 1; }
          rendered="$(helm template t "$CHART" -f deploy/gcp/staging-values.yaml)"
          # Forward: every key the job writes is a key the render reads. The
          # `- ` alternative is the brain's projected volume item, which is a
          # list entry rather than a secretKeyRef.
          for k in $wrote; do
            echo "$rendered" | grep -qE "^[[:space:]]*(- )?key: ${k//./\\.}\$" \
              || { echo "deploy.yml writes Secret key '$k' and nothing in the render reads it" >&2
                   exit 1; }
          done
          # Back: every key the chart REQUIRES — a secretKeyRef without
          # `optional: true`, the one whose absence wedges the pod in
          # CreateContainerConfigError — is a key the job writes.
          needs="$(echo "$rendered" | awk '
            pend != "" { if ($1 != "optional:" || $2 != "true") print pend; pend = "" }
            inref && $1 == "key:" { pend = $2 }
            $1 == "secretKeyRef:" { inref = 1 }
            END { if (pend != "") print pend }' | sort -u)"
          for k in $needs; do
            echo "$wrote" | grep -qxF "$k" \
              || { echo "the chart requires Secret key '$k' and deploy.yml never writes it" >&2
                   exit 1; }
          done
          # And all of it against the PRE-CREATED Secret, whose name is also the
          # `K8S_SECRET` the deploy job applies. Dropping `existingSecret`
          # entirely fails the render (secret.yaml's required-apiKey guard), but
          # CHANGING it renders green while binding every reference above to a
          # Secret nothing creates.
          echo "$rendered" | grep -qE '^[[:space:]]*name: map-platform$' \
            || { echo "the render does not bind to the pre-created Secret map-platform" >&2; exit 1; }
          echo "ok: deploy.yml writes exactly the seven keys the render reads"
          echo "required, so unset would wedge the pods: $(echo "$needs" | tr '\n' ' ')"
      - name: the bundled IdP is off by default and ships no default credential
        run: |
          # One seed, two deployment targets. The chart patches what differs per
          # deployment at render time rather than forking a second file, so the
          # copies must not drift — the ConfigMap template says so, and this is
          # what makes that true.
          cmp deploy/compose/casdoor-init-data.json "$CHART/files/casdoor-init-data.json" \
            || { echo "the compose and chart seeds have drifted" >&2; exit 1; }
          # Off by default: no Casdoor object may appear in a default render.
          helm template t "$CHART" -f "$VALUES" | grep -qi 'casdoor' \
            && { echo "default values must not deploy the bundled IdP" >&2; exit 1; }
          idp=(--set casdoor.enabled=true --set casdoor.ingress.host=idp.example.test
               --set 'casdoor.console.redirectURIs[0]=https://console.example/callback')
          # The three values the chart refuses to invent. adminPassword is the one
          # that matters most: Casdoor creates a GLOBAL administrator on the
          # publicly documented password `123` before it reads the seed, so a
          # chart that let this render would publish that through an Ingress.
          # redirectURIs is the one whose absence is not a startup failure but a
          # login failure — the seed's own callback is a laptop's and is replaced
          # unconditionally, so an empty list registers an application no
          # authorization-code request can ever complete against.
          for miss in adminPassword console.clientSecret console.redirectURIs; do
            args=("${idp[@]}" --set casdoor.adminPassword=pw --set casdoor.console.clientSecret=cs)
            err="$(helm template t "$CHART" -f "$VALUES" "${args[@]}" --set "casdoor.$miss=null" 2>&1 >/dev/null)" \
              && { echo "casdoor.$miss missing must fail the render" >&2; exit 1; }
            echo "$err" | grep -q "casdoor.$miss is required" \
              || { echo "the render without casdoor.$miss failed for the wrong reason: $err" >&2; exit 1; }
          done
          # The seed carries two credentials — the console's OAuth client secret
          # and a Casdoor GLOBAL administrator's password — so it must not be a
          # ConfigMap. `get configmaps` is routinely granted where `get secrets`
          # is not, and ConfigMaps sit outside encryption-at-rest defaults.
          helm template t "$CHART" -f "$VALUES" "${idp[@]}" --set casdoor.adminPassword=pw \
            --set casdoor.console.clientSecret=cs --show-only templates/casdoor-init-data-secret.yaml \
            | grep -q '^kind: Secret$' \
            || { echo "the seed must render as a Secret, not a ConfigMap" >&2; exit 1; }
          # A single-replica IdP that re-applies its seed on boot must not be
          # rolled: the default RollingUpdate rounds maxSurge up to 1, so an
          # upgrade would run two seeders and two --createDatabase against one
          # database.
          helm template t "$CHART" -f "$VALUES" "${idp[@]}" --set casdoor.adminPassword=pw \
            --set casdoor.console.clientSecret=cs --show-only templates/casdoor.yaml \
            | grep -q 'type: Recreate' \
            || { echo "the bundled IdP must use the Recreate strategy" >&2; exit 1; }
          full=("${idp[@]}" --set casdoor.adminPassword=pw --set casdoor.console.clientSecret=cs)
          seed="$(helm template t "$CHART" -f "$VALUES" "${full[@]}" \
            --show-only templates/casdoor-init-data-secret.yaml)"
          # The three demo accounts are real, working credentials on a laptop.
          # None may reach a published cluster IdP.
          for u in map-admin map-dev map-viewer; do
            echo "$seed" | grep -q "\"name\": \"$u\"" \
              && { echo "the chart seeded the demo account $u" >&2; exit 1; }
          done
          # ...while Casdoor's own administrator IS seeded, carrying the operator's
          # password for Casdoor itself to hash on apply. Leaving the account out
          # would not remove it, only leave `123` on it.
          echo "$seed" | grep -q '"name": "admin"' \
            || { echo "the chart did not re-own built-in/admin" >&2; exit 1; }
          echo "$seed" | grep -q '"passwordType": "plain"' \
            || { echo "built-in/admin must be seeded plain so Casdoor hashes it" >&2; exit 1; }
          # Deterministic renders are the reason it is seeded plain rather than
          # hashed here: bcrypt salts randomly, so a hash-at-render chart changes
          # this ConfigMap — and the Deployment checksum that tracks it — on every
          # render, rolling the IdP pod on unchanged values and leaving Argo/Flux
          # permanently OutOfSync. Same values in, same bytes out.
          again="$(helm template t "$CHART" -f "$VALUES" "${full[@]}" \
            --show-only templates/casdoor-init-data-secret.yaml)"
          [ "$seed" = "$again" ] \
            || { echo "two renders of identical values differ: the IdP will roll on every sync" >&2; exit 1; }
          # ...and it only takes effect because init data is allowed to re-apply.
          # With initDataNewOnly true, Casdoor skips the entry and keeps `123`.
          helm template t "$CHART" -f "$VALUES" "${full[@]}" --show-only templates/casdoor.yaml \
            | grep -A1 'name: initDataNewOnly' | grep -q 'value: "false"' \
            || { echo "initDataNewOnly must be false or the seeded admin password is ignored" >&2; exit 1; }
          # A value YAML did not read as a string must be refused, not rendered.
          # These land in JSON Casdoor unmarshals into string fields, so a number
          # abandons the whole seed — which leaves `123` on the global
          # administrator while looking exactly like a successful deploy. Both
          # input paths, because they differ: `--set` parses an integer, a values
          # FILE parses a float64, and a long float64 is silently rounded (the
          # same hazard the sandbox-hardening knobs hit, one JSON document on).
          cat > /tmp/casdoor-unquoted.yaml <<'YAML'
          casdoor:
            adminPassword: 12345678901234567890
            console:
              clientSecret: cs
          YAML
          for bad in "--set casdoor.adminPassword=12345678 --set casdoor.console.clientSecret=cs" \
                     "-f /tmp/casdoor-unquoted.yaml"; do
            err="$(helm template t "$CHART" -f "$VALUES" "${idp[@]}" $bad 2>&1 >/dev/null)" \
              && { echo "an unquoted credential must fail the render: $bad" >&2; exit 1; }
            echo "$err" | grep -q 'must be a quoted string' \
              || { echo "the unquoted render failed for the wrong reason: $err" >&2; exit 1; }
          done
          # ...and a quoted one still reaches the seed as a JSON string.
          helm template t "$CHART" -f "$VALUES" "${idp[@]}" \
            --set-string casdoor.adminPassword=12345678 --set casdoor.console.clientSecret=cs \
            --show-only templates/casdoor-init-data-secret.yaml \
            | grep -q '"password": "12345678"' \
            || { echo "a quoted credential did not render as a JSON string" >&2; exit 1; }
          # The audience Casdoor mints is the client id, so a render where the two
          # disagree is refused rather than left to fail every token behind a 401.
          # roleMap is set here only so this render reaches the audience check:
          # a mode with an empty role map is itself refused, one template earlier.
          err="$(helm template t "$CHART" -f "$VALUES" "${full[@]}" \
            --set identity.mode=oidc --set identity.oidc.issuer=https://idp.example.test \
            --set 'identity.roleMap.map/platform-admins=admin' \
            --set identity.oidc.audience=wrong 2>&1 >/dev/null)" \
            && { echo "an audience that is not the client id must fail the render" >&2; exit 1; }
          echo "$err" | grep -q 'must equal casdoor.console.clientId' \
            || { echo "the mismatched-audience render failed for the wrong reason: $err" >&2; exit 1; }
          echo "ok: bundled IdP is off by default, seeds no demo account, and owns its admin password"

  # The GCP staging Terraform (docs/plan/20, Decision 9). fmt and validate need
  # no credentials, no state and no GCP project, which is what lets them run on
  # every PR: the configuration would otherwise rot silently between the rare
  # runs that actually touch GCP, and the first symptom would be a failed apply
  # halfway through provisioning a cluster.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: make gcp-fmt
      - name: terraform validate
        run: make gcp-validate
      - name: the two configurations stay independent
        run: make gcp-split-check
      - name: shell scripts lint
        run: make gcp-lint
      # shellcheck cannot know that `gcloud secrets versions describe` rejects
      # `--filter`; it exited 0 on a bootstrap.sh that aborted on its first call
      # in every project. These RUN the tooling instead of reading it.
      - name: bootstrap script behaves
        run: make gcp-bootstrap-test
      - name: the split guard actually bites
        run: make gcp-split-check-test
      # And neither terraform validate nor shellcheck can execute SQL. This runs
      # dbinit.sql against a real PostgreSQL 16 with TLS on — including the cases
      # that drive its assertions red on purpose — so the only thing that
      # exercises it is not a billable cluster. ubuntu-latest ships Docker.
      - name: the database role SQL establishes what it claims
        run: make gcp-dbinit-test

  # Local dev stack: validate the compose file, build the image, and smoke-test
  # that the control plane comes up and serves (migrations + auth) and the brain
  # loads its model-providers config. The executor is left out — it wants the host
  # Docker socket, which a CI runner should not hand a build.
  compose:
    name: compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token has no reason to outlive this
          # step — checkout v6+ would otherwise leave it in a credentials file
          # wired into the job's git config.
          persist-credentials: false
      - name: seed local env from the committed example
        # model-providers.json is intentionally NOT created: the brain mount
        # defaults to the committed example, so this also exercises that default.
        run: cp .env.example .env
      - name: docker compose config is valid
        run: docker compose config --quiet
      # The stack below never starts openbao and the helm job only renders the
      # chart's copy, so the two scripts deciding whether a self-hosted stack can
      # encrypt anything are the part of this repo nothing here runs. #439 was a
      # failed init leaving a 0-byte init.json that the recovery branch read as a
      # good one. This runs both against a fake `bao`; no Docker, so it is cheap
      # and it fails before the image build.
      - name: the openbao bootstrap scripts behave
        working-directory: .
        run: make openbao-init-test
      - name: build the images
        # controlplane covers the shared server stage; gate-image keeps the
        # gate Docker stage regression-guarded (the executor itself stays out
        # of the CI stack, so gates never run here).
        run: docker compose build controlplane gate-image
      - name: control plane serves and the brain loads its config
        run: |
          docker compose up -d postgres minio controlplane brain
          key="$(grep '^CONTROLPLANE_API_KEY=' .env | cut -d= -f2-)"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $key" http://localhost:8080/v1/agents || true)"
            [ "$code" = "200" ] && { echo "control plane serving (200)"; break; }
            sleep 2
          done
          [ "$code" = "200" ] || { echo "control plane never served 200 (last: $code)" >&2; docker compose logs >&2; exit 1; }
          noauth="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/agents || true)"
          [ "$noauth" = "401" ] || { echo "expected 401 without a key, got $noauth" >&2; exit 1; }
          # The brain logs "brain running" only after LoadRoutes parses the mounted
          # model-providers.json, so this catches a config-shape or image regression.
          # It boots independently of the control plane, so poll rather than grep once —
          # a slow brain would otherwise fail this spuriously right after the 200.
          brain_ok=""
          for i in $(seq 1 15); do
            docker compose logs brain 2>/dev/null | grep -q "brain running" && { brain_ok=1; break; }
            sleep 2
          done
          [ -n "$brain_ok" ] || { echo "brain did not start cleanly" >&2; docker compose logs brain >&2; exit 1; }
          echo "ok: authed 200, unauthed 401, brain loaded its config"
      # E2E-1 (docs/plan/06_skills.md): the wire-only skills round-trip against
      # the bundled MinIO — upload both forms, list, download and byte-compare,
      # and prove the delete order (skill delete 400s until versions are gone).
      - name: skills registry round-trip (E2E-1)
        run: |
          key="$(grep '^CONTROLPLANE_API_KEY=' .env | cut -d= -f2-)"
          base=http://localhost:8080/v1/skills
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/demo-skill"
          printf -- '---\nname: demo-skill\ndescription: A CI fixture skill.\n---\n# Demo\n' > "$workdir/demo-skill/SKILL.md"
          (cd "$workdir" && zip -qr skill.zip demo-skill)
          created="$(curl -sf -H "x-api-key: $key" -F 'files[]=@'"$workdir"'/skill.zip' "$base")"
          id="$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          ver="$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest_version"])')"
          echo "created $id version $ver"
          curl -sf -H "x-api-key: $key" "$base?source=custom" | grep -q "$id"
          curl -sf -H "x-api-key: $key" "$base/$id" > /dev/null
          # Second version via the loose path-qualified form.
          v2="$(curl -sf -H "x-api-key: $key" -F 'files[]=@'"$workdir"'/demo-skill/SKILL.md;filename=demo-skill/SKILL.md' "$base/$id/versions" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          n="$(curl -sf -H "x-api-key: $key" "$base/$id/versions" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]))')"
          [ "$n" = "2" ] || { echo "expected 2 versions, got $n" >&2; exit 1; }
          # The download streams the stored archive unmodified.
          curl -sf -H "x-api-key: $key" "$base/$id/versions/$ver/content" -o "$workdir/down.zip"
          cmp "$workdir/skill.zip" "$workdir/down.zip"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "x-api-key: $key" "$base/$id")"
          [ "$code" = "400" ] || { echo "expected 400 deleting a skill with versions, got $code" >&2; exit 1; }
          curl -sf -X DELETE -H "x-api-key: $key" "$base/$id/versions/$ver" > /dev/null
          curl -sf -X DELETE -H "x-api-key: $key" "$base/$id/versions/$v2" > /dev/null
          curl -sf -X DELETE -H "x-api-key: $key" "$base/$id" > /dev/null
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $key" "$base/$id")"
          [ "$code" = "404" ] || { echo "expected 404 after delete, got $code" >&2; exit 1; }
          echo "ok: upload (zip + loose), list, download byte-compare, ordered delete"
      - name: tear down
        if: always()
        run: docker compose down -v

  # Tests + the coverage gate as a distinct named check, so PRs show
  # "coverage" pass/fail on its own and the summary carries the numbers.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the token has no reason to outlive this
          # step — checkout v6+ would otherwise leave it in a credentials file
          # wired into the job's git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Kubernetes sandbox backend's contract test runs against a real
      # cluster (a missing cluster is a hard failure, not a skip, like the Docker
      # daemon). kind-action installs kind and sets the current kubeconfig
      # context, which the test picks up by default; its pods pull their images
      # from the runner's network.
      - name: create kind cluster (k8s sandbox contract test)
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: map-ci
      # Both steps live in the Makefile — the single executable source of the
      # gate (denominator exclusions and the exact-percentage awk documented
      # there); the verifier runs the same targets via `make verify`.
      - name: test (-count=1) with coverage profile
        run: make test
      - name: coverage gate (>= 90%)
        run: make cover-gate
      - name: coverage summary
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          {
            echo "### Statement coverage over \`./internal/...\` (gate: ≥ 90%)"
            echo ""
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk 'NR>1 { stmts[$1]=$2; if ($3>0) covered[$1]=1 }
                 END { for (b in stmts) { pkg=b; sub(/\/[^\/]*$/,"",pkg)
                         t[pkg]+=stmts[b]; if (b in covered) c[pkg]+=stmts[b] }
                       for (p in t) printf "| %s | %.1f%% |\n", p, 100*c[p]/t[p] }' coverage.out | sort
            awk 'NR>1 { stmts[$1]=$2; if ($3>0) covered[$1]=1 }
                 END { for (b in stmts) { T+=stmts[b]; if (b in covered) C+=stmts[b] }
                       printf "| **total** | **%.2f%%** |\n", 100*C/T }' coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore
