name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot's PRs skip the review rather than fail it. A run Dependabot
    # triggers sees only Dependabot secrets, so CLAUDE_CODE_OAUTH_TOKEN is
    # empty there, and the action refuses a bot actor it was not told to
    # allow — it failed #603 and #604 at that gate before reading a line.
    # What a Dependabot PR keeps is `make pins-test`, the pin-shape check;
    # that the SHA is the tagged commit stays the merger's to confirm. The
    # predicate is `github.actor` because that is what selects the secret
    # source, so a maintainer's push to a Dependabot branch is still reviewed.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Same argument as claude.yml's, which see: the action supplies its
          # own token, and the credential checkout persists would otherwise
          # outrank it rather than merely sit there unused. What differs here
          # is what then runs on the action's token instead of this job's —
          # a fetch of `origin/<base>` the action itself makes, not a step in
          # this file, to restore `.claude/` and CLAUDE.md from the base branch
          # before it trusts them, a PR head being untrusted input.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

