name: deploy

# Continuous delivery to the one staging environment on GCP: build, push, deploy,
# smoke — and nothing else. The operating notes are in deploy/gcp/README.md's
# "Continuous delivery" section; this header carries only the decisions the file
# itself cannot show.
#
# The deployment is **mode 2** — Cloud SQL, Cloud Storage and Cloud KMS behind the
# pre-created Secret `deploy/gcp/staging-values.yaml` names in `existingSecret`.
# Not mode 1: a pipeline that installed the bundled Postgres/MinIO/OpenBao on
# every push would keep the platform's data in three StatefulSets while the Cloud
# SQL instance `environment/` created — and `make gcp-db-init` already prepared —
# sat unused.
#
# The trigger is every push to main. There is one environment, no promotion
# pipeline and no release train to synchronise with, so "what is deployed" is
# simply "what is on main" — and a staging environment that lags main is a
# staging environment nobody trusts. workflow_dispatch is for the cases a push
# cannot express: redeploying onto a rebuilt cluster from an unchanged commit, or
# re-running after a human has rotated a Secret Manager value.
#
# This workflow never runs Terraform. The infrastructure lives in
# deploy/gcp/foundation/ and deploy/gcp/environment/, whose applies are
# interactive on purpose and whose state is local by design (plan 20, Decision 9).
# A CD job running `terraform apply` would have to hold that state somewhere it
# could reach, and would be one bad plan away from destroying the Cloud SQL
# instance the platform's data lives in. `make gcp-foundation-apply`,
# `make gcp-bootstrap`, `make gcp-env-apply` and `make gcp-db-init` stay
# human-driven; this workflow assumes they have already run. In mode 2 that last
# one is not a formality: the DSN in `database-url` names the `map` role, and
# `gcp-db-init` is the only thing that creates it.
#
# There is no GitHub secret in this repository and there must not be one. The job
# mints an OIDC token, Workload Identity Federation exchanges it for a short-lived
# impersonation of `DEPLOY_SERVICE_ACCOUNT`, and every credential the deploy needs
# is then read from Secret Manager at run time. So rotating a credential is
# `gcloud secrets versions add` plus a re-run of this workflow — no repository
# setting to update afterwards, and no long-lived key sitting in a settings page
# to leak. The re-run is not a formality: env from a `secretKeyRef` is read once
# at process start, so the "Roll the pods onto the rotated Secret" step below is
# what actually retires the old value.
#
# The provider is locked to `assertion.repository_owner == 'OpenSDLC-Dev'` and
# each repository is bound to the deploy identity separately, so a fork cannot use
# it. It also asserts `assertion.ref == 'refs/heads/main'` and
# `assertion.ref_type == 'branch'`. Two controls, in this order: the "Deploys run
# from main only" step below runs before the auth action, so an ordinary
# `workflow_dispatch` from another branch stops there and never reaches a token
# exchange. The provider
# condition is the backstop for the case the guard cannot cover — a branch
# carrying an edited copy of this file, which would delete the guard along with
# it, and which then fails at the exchange instead. The condition is cloud-side
# and the provider is not in this repository's Terraform, so the command that set
# it lives in deploy/gcp/README.md's "Continuous delivery" section, the only place
# it is written down.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue, never cancel. A cancelled `helm upgrade` does not roll back — it leaves
# the release wedged mid-upgrade with no run left to finish it, which is exactly
# the half-updated cluster `--atomic` exists to prevent. Two pushes in quick
# succession therefore deploy in order and the later one wins, at the cost of
# waiting out the first.
#
# The group name is not unique across the organisation — managed-agent-console has
# a `deploy-staging` of its own — and it does not need to be: a concurrency group
# is scoped to ONE repository, so the two never contend. Nor should they be read
# as serialised because they share a name. They deploy two different Helm releases
# into the same namespace, and nothing here can order them against each other;
# GitHub has no cross-repository lock to ask for.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Nothing at the workflow level. `id-token: write` granted here would be inherited
# by every job added later, including one with no reason to hold a cloud
# impersonation; the one job that needs it asks for it itself.
permissions: {}

# Which deployment this is. None of these is a credential — they are project,
# cluster, registry, bucket, key and identity NAMES, and the WIF provider is
# public infrastructure locked by attribute condition. They are nonetheless
# repository VARIABLES rather than literals, because this repository is PUBLIC:
# one that names one operator's project, cluster, registry, buckets, KMS key and
# service accounts hands a reader a target list, and — the part that matters for
# an open-source project — ties the repository to a cluster nobody cloning it can
# reach. `deploy/` here is a reference deployment, not a template.
#
# Set them under Settings → Secrets and variables → Actions → Variables; the list
# with what each one names is in deploy/gcp/README.md, "The deployment's
# coordinates". Every value came from
# `terraform -chdir=deploy/gcp/environment output`.
#
# The cost is real and is accepted rather than hidden: the deployment target is
# no longer reviewable in the diff that changes it, because a variable is edited
# in a settings page and not in a PR. The "Require the deployment variables" step
# below is what keeps that from being silent — it names every variable it needs
# before anything authenticates.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_ZONE: ${{ vars.GCP_ZONE }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  # HOST/PROJECT/REPOSITORY, as ONE variable rather than a host and a path joined
  # here. `${{ vars.A }}/${{ vars.B }}` with either half unset renders as `host/`
  # or `/path` — non-empty, so it would pass the guard below and fail at the
  # pull. The host, and the registry/repository split the chart wants, are taken
  # back off this single value by parameter expansion where each is needed.
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
  # The two non-secret coordinates that go INTO the pre-created Secret. They are
  # not credentials — a bucket name and a KMS resource name — but the chart reads
  # them from that Secret in mode 2, because `existingSecret` means the chart
  # writes no Secret at all and so has nowhere else to put them.
  BLOB_BUCKET: ${{ vars.BLOB_BUCKET }}
  KMS_KEY_NAME: ${{ vars.KMS_KEY_NAME }}
  # The three Workload-Identity-bound Google service accounts, one per component.
  # They used to live in staging-values.yaml; that file now carries a NEUTRAL
  # example of the same three keys and the `helm upgrade` below overrides all
  # three from here. Both halves are needed and neither is optional: the IAM
  # binding is applied by `environment/`, the KSA annotation comes from the chart
  # values, and a missing annotation is an ADC failure at pod startup.
  CONTROLPLANE_SERVICE_ACCOUNT: ${{ vars.CONTROLPLANE_SERVICE_ACCOUNT }}
  BRAIN_SERVICE_ACCOUNT: ${{ vars.BRAIN_SERVICE_ACCOUNT }}
  EXECUTOR_SERVICE_ACCOUNT: ${{ vars.EXECUTOR_SERVICE_ACCOUNT }}
  # NOT variables, deliberately. These three name the CHART's own objects — the
  # namespace it installs into, the pre-created Secret its `existingSecret` value
  # names, the release — so they identify no operator and nothing here is hidden
  # by moving them. `K8S_SECRET` in particular must equal `existingSecret` in
  # staging-values.yaml, which is in git: a variable would let the two drift into
  # a release bound to a Secret nothing creates, with no diff to notice it in.
  K8S_NAMESPACE: map
  K8S_SECRET: map-platform
  HELM_RELEASE: map

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token WIF exchanges; the only reason this job can authenticate
      contents: read # actions/checkout
    steps:
      # `workflow_dispatch` takes a ref and GitHub runs the workflow file FROM
      # that ref, so without this a push to any branch is a deployment path that
      # never passed review. This closes the accidental half — a dispatch from
      # the wrong ref stops here, before the auth step mints a token. It is not
      # the control: a branch that edits this file deletes this step too. The
      # control is `assertion.ref` on the WIF provider, which is cloud-side; see
      # the header and deploy/gcp/README.md's "Continuous delivery".
      - name: Deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy runs only from refs/heads/main; this run is on $GITHUB_REF"
          exit 1

      # Second, not first, and the order is the point: the step above refuses an
      # unauthorised ref while telling it nothing, and this one prints the
      # deployment's configuration keys. Refuse, then diagnose. Both still run
      # before checkout, auth and any build.
      #
      # An unset repository variable renders as the EMPTY STRING rather than
      # failing, and every way that lands is late and confusing: `gcloud
      # --project ""`, `gcloud container clusters get-credentials "" --zone ""`,
      # a `docker push ":$GITHUB_SHA"` that is a tag with no repository, a
      # ServiceAccount annotated with the empty identity. Asserting here costs a
      # second and turns all of them into one line naming what is missing —
      # which is also the error a fresh deployment of this repository gets,
      # instead of a failure four steps in.
      #
      # Whitespace and commas are rejected, not merely emptiness. A value of one
      # space is no configuration while passing a `-z` test; and five of these
      # reach `helm --set-string`, whose assignment list is COMMA-separated, so a
      # comma would silently split one value into two paths and set neither to
      # what was meant. No GCP project id, zone, cluster name, registry path,
      # bucket, KMS resource name or service-account email may contain either
      # character, so this rejects nothing legitimate.
      - name: Require the deployment variables
        # ${!v} — indirect expansion — is bash, and this file already assumes
        # bash elsewhere (`set -o pipefail`). Stated rather than inherited from
        # the runner's default shell.
        shell: bash
        run: |
          bad=""
          for v in GCP_PROJECT_ID GCP_ZONE GKE_CLUSTER ARTIFACT_REGISTRY \
                   WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT BLOB_BUCKET KMS_KEY_NAME \
                   CONTROLPLANE_SERVICE_ACCOUNT BRAIN_SERVICE_ACCOUNT \
                   EXECUTOR_SERVICE_ACCOUNT; do
            case "${!v}" in
              "" | *[[:space:],]*) bad="$bad $v" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::unset, empty or malformed repository variables:$bad — set them under Settings → Secrets and variables → Actions → Variables. What each one names is listed in deploy/gcp/README.md, under The deployment's coordinates."
            exit 1
          fi

          # The one composed value, checked for the shape the two expansions
          # below assume. `${ARTIFACT_REGISTRY%%/*}` and `${ARTIFACT_REGISTRY#*/}`
          # on a value with no slash both return the whole string, so `registry`
          # and `repository` would be the same host and the chart would render
          # `host/host/controlplane:sha` — a reference that is merely wrong
          # rather than invalid, so the render succeeds and three pods sit in
          # ImagePullBackOff.
          case "$ARTIFACT_REGISTRY" in
            */*/*) ;;
            *)
              echo "::error::ARTIFACT_REGISTRY must be HOST/PROJECT/REPOSITORY, e.g. us-central1-docker.pkg.dev/your-project/map-images — got '$ARTIFACT_REGISTRY'"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to outlive this step —
          # checkout v6+ would otherwise leave it in a credentials file wired into
          # the job's git config, in a job that also holds a cloud impersonation.
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          # `kubectl` on the runner cannot talk to GKE without this: since
          # client-go 1.26 the in-tree GCP auth provider is gone, and
          # `get-credentials` writes a kubeconfig whose exec credential names the
          # plugin. Missing, every kubectl call fails with "no Auth Provider
          # found" — after the images have already been built and pushed.
          install_components: gke-gcloud-auth-plugin

      # Submitted from the repository ROOT with `.` as the context, because the
      # Dockerfile builds the whole Go module. `cloudbuild.yaml` turns that one
      # context into four images: controlplane/brain/executor are three tags on a
      # single build — the chart composes `registry/repository/COMPONENT:tag`, so
      # it looks for three names, and three tags on one build means they cannot
      # drift — plus `--target gate` for the egress sidecar.
      #
      # `_TAG` is the full commit SHA, and it is derived ONCE: the same value
      # becomes `image.tag` and the `gate:` reference below. Deriving it twice is
      # how a deploy comes to name an image that was never pushed.
      #
      # Built on the runner rather than submitted to Cloud Build, and that is a
      # correction rather than a preference: the first real run of this workflow
      # failed here, in under a second, before a byte was uploaded —
      #
      #   ERROR: (gcloud.builds.submit) The user is forbidden from accessing the
      #   bucket [PROJECT_cloudbuild]. Please check your organization's policy
      #   or if the user has the "serviceusage.services.use" permission.
      #
      # — and it kept failing with roles/storage.admin on that bucket AND
      # roles/serviceusage.serviceUsageConsumer on the project, which is the
      # documented remedy. `builds submit` stages the source as the CALLER, not
      # as the build's --service-account, so the manual runs that worked proved
      # nothing about this one: there the caller was a human with Owner.
      #
      # Building here needs exactly one permission the job already holds,
      # artifactregistry.writer, and no bucket, no staging upload and no Cloud
      # Build API at all. deploy/gcp/cloudbuild.yaml stays as the manual path's
      # build definition; the two must be kept saying the same thing, which is
      # why the tags below are written out rather than inferred.
      #
      # DOCKER_BUILDKIT is not set: Docker on ubuntu-latest already defaults to
      # BuildKit, which is what `FROM --platform=$BUILDPLATFORM` in the
      # Dockerfile requires. cloudbuild.yaml has to ask for it because the
      # classic builder is what `gcr.io/cloud-builders/docker` still runs.
      - name: Build and push the images
        run: |
          # The registry HOST, which is `ARTIFACT_REGISTRY` up to its first
          # slash. Passing the whole HOST/PROJECT/REPOSITORY path here would
          # register a credential helper for a "host" that does not resolve, and
          # the push would then fail as an anonymous pull of a private registry.
          gcloud auth configure-docker "${ARTIFACT_REGISTRY%%/*}" --quiet

          # One build, three tags — so controlplane, brain and executor resolve
          # to a single digest and cannot drift apart between components.
          docker build \
            -t "$ARTIFACT_REGISTRY/controlplane:$GITHUB_SHA" \
            -t "$ARTIFACT_REGISTRY/brain:$GITHUB_SHA" \
            -t "$ARTIFACT_REGISTRY/executor:$GITHUB_SHA" \
            .
          # The gate is a separate image: the per-session egress sidecar needs
          # iptables and a dedicated UID that do not belong in the server image.
          # Reuses the layers just built, so it is cheap.
          docker build --target gate \
            -t "$ARTIFACT_REGISTRY/gate:$GITHUB_SHA" \
            .

          for component in controlplane brain executor gate; do
            docker push "$ARTIFACT_REGISTRY/$component:$GITHUB_SHA"
          done

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Cluster credentials
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            --zone "$GCP_ZONE" --project "$GCP_PROJECT_ID"

      # Mode 2's Secret, assembled here because nothing else can assemble it: the
      # chart renders no Secret when `existingSecret` is set, and Terraform holds
      # no secret VALUES by design. Three keys come from Secret Manager and four
      # are literals that belong in the same object only because that is the shape
      # `existingSecret` defines.
      #
      # `kubectl create secret --dry-run=client -o yaml | kubectl apply -f -`
      # rather than `create`: this runs on every push, and `create` fails the
      # second time. Apply also makes a rotation a re-run of this job.
      - name: Assemble the mode-2 Secret
        run: |
          set -euo pipefail

          # Outside the checkout, so no later step can sweep a credential into an
          # image, an artifact or a `git add -A`. Mode 700 because the values are
          # written by `gcloud --out-file`, which does not chmod what it creates.
          d="$(mktemp -d)"
          chmod 700 "$d"
          echo "SECRET_DIR=$d" >> "$GITHUB_ENV"

          # Register a value as a redaction BEFORE anything else can print it.
          # This workflow's log is public, and the two ways a value gets into it
          # are both one edit away rather than hypothetical: dropping `--out-file`
          # from the `gcloud secrets versions access` below, which then prints the
          # value to stdout, and a `set -x` added while debugging, which prints
          # every expansion.
          #
          # What masking does NOT cover is the base64 form — `add-mask` is a
          # literal string replacement — and `kubectl create secret -o yaml` emits
          # every value base64-encoded. That output stays on the pipe into
          # `kubectl apply` for exactly that reason: do not capture it into a
          # variable, and do not `tee` it while debugging.
          #
          # Short lines are left alone deliberately. A mask replaces EVERY
          # occurrence of the string in the log, so masking something like "map"
          # would redact half the output and hide the failure it was added to
          # catch. Eight characters is the shortest value worth protecting here;
          # anything shorter is not a credential we can usefully hide anyway.
          mask() {
            while IFS= read -r line || [ -n "$line" ]; do
              if [ "${#line}" -ge 8 ]; then printf '::add-mask::%s\n' "$line"; fi
            done < "$1"
          }

          # fetch SECRET_ID DEST — reads the latest version straight to a file.
          # `--out-file` rather than a command substitution: the value never
          # becomes a shell variable, never reaches an argv, and keeps its exact
          # bytes, which is what `--from-file` then hands to Kubernetes.
          fetch() {
            if ! gcloud secrets versions access latest \
                   --secret="$1" --project="$GCP_PROJECT_ID" --out-file="$d/$2"; then
              echo "::error::cannot read Secret Manager secret '$1' in $GCP_PROJECT_ID"
              echo "The mode-2 deploy needs it. Check it exists and has an ENABLED version:" >&2
              echo "  gcloud secrets versions list $1 --project=$GCP_PROJECT_ID" >&2
              return 1
            fi
            # A zero-byte value is the failure worth catching here rather than at
            # pod start: it is what a failed generator piped into
            # `gcloud secrets versions add` produces — stored successfully, and
            # now `latest`. The Secret would apply cleanly and the platform would
            # then authenticate as nobody.
            if [ ! -s "$d/$2" ]; then
              echo "::error::Secret Manager secret '$1' has an EMPTY latest version"
              echo "Add a real version and disable that one." >&2
              return 1
            fi
            mask "$d/$2"
          }

          fetch controlplane-api-key controlplane-api-key
          fetch database-url         database-url

          # A trailing newline is the classic way one of these gets stored (an
          # `echo` where bootstrap.sh uses `printf '%s'`), and both are embedded
          # VERBATIM: one in an x-api-key comparison, one as a DSN. So the deploy
          # would succeed and the platform would then reject the very key this job
          # smoke-tests with, or fail to parse its own database URL. Refuse it
          # here, where the fix is one command.
          #
          # model-providers.json is deliberately NOT checked this way: it is a
          # JSON document read by a parser, a human adds it with
          # `--data-file=/path/to/file`, and every editor on earth ends a file
          # with a newline. Its shape is checked below instead.
          for f in controlplane-api-key database-url; do
            if [ "$(wc -l < "$d/$f")" -ne 0 ]; then
              echo "::error::Secret Manager secret '$f' contains a newline"
              echo "It is used verbatim, so a trailing newline is part of the value." >&2
              echo "Re-add it without one: printf '%s' \"\$value\" | gcloud secrets" >&2
              echo "versions add $f --project=$GCP_PROJECT_ID --data-file=-" >&2
              exit 1
            fi
          done

          # model-providers is fetched on its own because its failure mode is its
          # own. The secret CONTAINER is created by the foundation apply and can
          # sit without a version: it carries a live model API key, the one
          # credential no automation may mint. If that is the state, this job stops
          # here — loudly, naming the command — rather than deploying a brain that
          # crash-loops on an empty config.
          #
          # It DOES have a version today, and that version is a PLACEHOLDER: a real
          # endpoint (https://api.anthropic.com) with a fake key, stored so this
          # pipeline could be proven end to end without inventing a credential. The
          # platform comes up, /v1/agents answers 200, this job goes green — and
          # the first session that calls a model fails with an auth error, which is
          # the truth about it. Replace it, in one line:
          #
          #   printf '%s' '[{"model":"*","protocol":"anthropic","base_url":"https://api.anthropic.com","api_key":"sk-ant-REAL"}]' \
          #     | gcloud secrets versions add model-providers --project="$GCP_PROJECT_ID" --data-file=-
          if ! gcloud secrets versions access latest \
                 --secret=model-providers --project="$GCP_PROJECT_ID" \
                 --out-file="$d/model-providers.json"; then
            echo "::error::the 'model-providers' secret has no readable version — a human must add one"
            cat >&2 <<EOF
          This is deliberate and this workflow cannot fix it: model-providers holds a
          live model API key. Write the routes to a file and add them as a version:

            [ { "model": "*", "protocol": "anthropic",
                "base_url": "https://your-gateway.example",
                "api_key": "sk-..." } ]

            gcloud secrets versions add model-providers \\
              --project=$GCP_PROJECT_ID --data-file=/path/to/model-providers.json

          The accepted keys are documented under brain.modelProviders in
          deploy/helm/managed-agent-platform/values.yaml. base_url is the API ROOT:
          the adapter appends /v1/messages or /v1/chat/completions itself, so omit a
          trailing /v1. Then re-run this workflow (Actions -> deploy -> Run workflow).
          EOF
            exit 1
          fi

          # The brain's loader (internal/provider.LoadRoutes) requires a JSON ARRAY
          # of route objects and rejects anything else with "must be a JSON array".
          # Checking it here costs a second; getting it wrong costs the full
          # `--wait --atomic --timeout 10m` before the release rolls back.
          if ! jq -e 'type == "array" and length > 0 and all(.[]; has("model"))' \
               "$d/model-providers.json" > /dev/null; then
            echo "::error::the 'model-providers' secret is not a non-empty JSON array of route objects"
            echo "Each entry needs at least \"model\" (\"*\" is the default route)." >&2
            exit 1
          fi

          # The api_key inside is the actual secret; the surrounding JSON is not.
          # Masking per line would be useless here (a pretty-printed payload would
          # register "[" as a redaction), so mask exactly the keys.
          jq -r '.[].api_key // empty' "$d/model-providers.json" |
            while IFS= read -r k; do
              if [ "${#k}" -ge 8 ]; then printf '::add-mask::%s\n' "$k"; fi
            done

          # The four literals. Non-secret coordinates, but the chart reads all
          # seven keys from this one object — `blob-backend` missing does not fail,
          # it reads as the default "s3" and then looks for an endpoint that is not
          # there.
          printf '%s' gcs             > "$d/blob-backend"
          printf '%s' "$BLOB_BUCKET"  > "$d/blob-bucket"
          printf '%s' gcpkms          > "$d/secrets-backend"
          printf '%s' "$KMS_KEY_NAME" > "$d/gcpkms-key-name"

          # The namespace must exist before the Secret does, and `helm --create-namespace`
          # runs after this step. Applied the same way for the same reason: it is
          # already there on every run but the first.
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml \
            | kubectl apply -f - > /dev/null

          # --from-file, never --from-literal. A literal would put every one of
          # these on this process's argv, visible in `ps` to anything else on the
          # runner and in any log that captured the command line. The file name is
          # the Secret key, which is why the fetch destinations above are named
          # after the keys rather than after the Secret Manager secrets.
          #
          # Its one line of output — "created", "configured" or "unchanged" — is
          # kept, because it is the only thing in this job that knows whether a
          # rotation actually landed. It names the object and never a value, so
          # it is safe to hold in a variable, unlike the manifest on the pipe.
          applied="$(kubectl create secret generic "$K8S_SECRET" \
            --namespace "$K8S_NAMESPACE" \
            --from-file="$d/controlplane-api-key" \
            --from-file="$d/database-url" \
            --from-file="$d/model-providers.json" \
            --from-file="$d/blob-backend" \
            --from-file="$d/blob-bucket" \
            --from-file="$d/secrets-backend" \
            --from-file="$d/gcpkms-key-name" \
            --dry-run=client -o yaml \
            | kubectl apply -f -)"
          echo "$applied"

          # Nothing else can notice. Env from a `secretKeyRef` is read once, at
          # process start; `helm upgrade` cannot see this Secret at all, because
          # `existingSecret` means the chart renders none and its
          # `checksum/secret` annotation therefore hashes an empty template on
          # every run; and the case this matters in — a workflow_dispatch after a
          # human rotated a Secret Manager value — deploys the same commit, so
          # the pod template is byte-identical and Kubernetes correctly does
          # nothing. The pods would go on serving the revoked key and the old
          # DSN, and the smoke check below would fail with the *new* key against
          # them. So record whether the Secret changed; the step after the
          # upgrade rolls the pods when it did.
          case "$applied" in
            *unchanged) echo "SECRET_CHANGED=false" >> "$GITHUB_ENV" ;;
            *) echo "SECRET_CHANGED=true" >> "$GITHUB_ENV" ;;
          esac

      # --atomic is the whole reason this is one command and not a sequence: a
      # failed upgrade rolls the release back instead of leaving half the pods on
      # the new images and half on the old, with the schema migrated by whichever
      # got there first. --wait is what gives --atomic something to judge.
      #
      # There is not one credential on this command line, and that is a property of
      # mode 2 rather than a discipline applied to it: `existingSecret` in
      # staging-values.yaml means the chart writes no Secret, so it takes no
      # credential VALUES at all. The step names the release, the values file, the
      # two references that come from the build, and the five coordinates that
      # identify this deployment.
      #
      # Those five are the other half of `deploy/gcp/staging-values.yaml` being a
      # REFERENCE DEPLOYMENT rather than this cluster's values file: it carries a
      # complete, self-rendering mode-2 example under a neutral project name, and
      # every key in it that would name an operator is overridden here from a
      # repository variable. The alternative — deleting those keys from the file —
      # was rejected: `helm template -f staging-values.yaml` is exactly what CI
      # runs on it, and a file missing `image.registry` renders against the
      # chart's ghcr.io defaults while a file missing the annotations renders a
      # KSA with no identity, so the example would document a deployment that
      # cannot work. Dropping an override here fails closed, and by construction
      # rather than by luck: the example registry host is `registry.invalid`,
      # which RFC 2606 reserves so that it can never resolve (ImagePullBackOff),
      # and impersonating an identity in a project this deployment does not
      # control needs a binding it does not have (ADC fails at pod startup).
      # `--wait --atomic` turns either into a rolled-back release and a red run
      # rather than a half-configured cluster.
      #
      # --set-string throughout, not --set. Every one of these is a string by
      # definition, and `--set` would infer the type instead of being told it — a
      # question that does not need asking about a value whose answer is known.
      # (A 40-char hex SHA is safe either way; the point is not to re-derive that
      # for the next value someone adds here.)
      #
      # The annotation KEY contains dots that are not path separators, so they are
      # escaped: unescaped, `iam.gke.io/gcp-service-account` would nest four
      # levels of map under `annotations` and the KSA would carry no annotation
      # the GKE metadata server looks for. The values are safe to interpolate
      # because the guard step rejects a comma — `--set-string` splits on one.
      - name: Deploy the chart
        run: |
          set -euo pipefail
          # The chart composes {registry}/{repository}/{component}:{tag}, so the
          # split is at the FIRST slash of ARTIFACT_REGISTRY and nowhere else.
          # Getting it wrong renders a reference that is merely wrong rather than
          # invalid — the render succeeds, the pods never pull.
          helm upgrade --install "$HELM_RELEASE" deploy/helm/managed-agent-platform \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            -f deploy/gcp/staging-values.yaml \
            --set-string "image.registry=${ARTIFACT_REGISTRY%%/*}" \
            --set-string "image.repository=${ARTIFACT_REGISTRY#*/}" \
            --set-string "controlplane.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=$CONTROLPLANE_SERVICE_ACCOUNT" \
            --set-string "brain.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=$BRAIN_SERVICE_ACCOUNT" \
            --set-string "executor.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=$EXECUTOR_SERVICE_ACCOUNT" \
            --set-string "image.tag=$GITHUB_SHA" \
            --set-string "executor.gateImage=$ARTIFACT_REGISTRY/gate:$GITHUB_SHA" \
            --wait --atomic --timeout 10m

      # Only when the Secret really changed — see the note at the end of the
      # assemble step. On an ordinary push the seven values are identical, this
      # is skipped, and the rollout `helm upgrade` already performed for the new
      # `image.tag` is the only one. On a rotation dispatch it is the only
      # rollout there is.
      #
      # `--atomic` does not cover this: the release is complete before the
      # restart begins, so a Secret the platform cannot use leaves the pods
      # crash-looping rather than rolling the release back. That is the same
      # state a bad Secret would produce anyway, and `rollout status` fails the
      # job on it instead of leaving the smoke check to time out.
      - name: Roll the pods onto the rotated Secret
        if: env.SECRET_CHANGED == 'true'
        run: |
          set -euo pipefail
          # By label, like the smoke step: the names come from the release.
          deploys="$(kubectl get deployments --namespace "$K8S_NAMESPACE" \
            --selector "app.kubernetes.io/instance=$HELM_RELEASE" -o name)"
          if [ -z "$deploys" ]; then
            echo "::error::no Deployment matched app.kubernetes.io/instance=$HELM_RELEASE"
            kubectl get deployments --namespace "$K8S_NAMESPACE" >&2
            exit 1
          fi
          for dep in $deploys; do
            kubectl rollout restart --namespace "$K8S_NAMESPACE" "$dep"
          done
          for dep in $deploys; do
            kubectl rollout status --namespace "$K8S_NAMESPACE" "$dep" --timeout=5m
          done

      # Ready pods are not a working API. This is the only step that proves the
      # LoadBalancer exists, that the deployed key is the key Secret Manager holds,
      # that the control plane can reach Cloud SQL — a 200 on a list endpoint is a
      # round trip through the database — and that the API is not answering
      # everyone.
      - name: Smoke — the public API answers
        run: |
          set -euo pipefail

          # By label, not by name. The Service is named from the release
          # (map.fullname → "map-managed-agent-platform-controlplane"), so a
          # hard-coded name would fail here as "not found" and read like an
          # infrastructure problem the day the release or chart name changes.
          #
          # No `|| true`: kubectl's jsonpath tolerates a missing key
          # (--allow-missing-template-keys defaults to true), so a Service whose
          # `ingress` is not yet assigned prints nothing and exits 0 — which is
          # what this loop is polling for. Swallowing the status would only hide a
          # real kubectl failure (expired credentials, unreachable API server) as
          # ten minutes of empty polling blamed on the load balancer.
          ip=""
          for _ in $(seq 1 60); do
            ip="$(kubectl get svc --namespace "$K8S_NAMESPACE" \
              --selector "app.kubernetes.io/instance=$HELM_RELEASE,app.kubernetes.io/component=controlplane" \
              -o jsonpath='{.items[*].status.loadBalancer.ingress[0].ip}')"
            if [ -n "$ip" ]; then break; fi
            sleep 10
          done
          if [ -z "$ip" ]; then
            echo "::error::the controlplane Service never got an external IP (10 min)"
            kubectl get svc --namespace "$K8S_NAMESPACE" >&2
            kubectl describe svc --namespace "$K8S_NAMESPACE" \
              --selector "app.kubernetes.io/instance=$HELM_RELEASE,app.kubernetes.io/component=controlplane" >&2
            exit 1
          fi
          echo "controlplane external IP: $ip"

          # The key goes into a curl CONFIG FILE, not onto curl's argv — the same
          # rule the Secret step states about --from-literal, and it applies just
          # as much here: `-H "x-api-key: $key"` is an argument, visible in `ps`
          # for the life of the request. Mode 600, inside the 700 temp dir, built
          # by concatenation so the value is never even a shell variable.
          cfg="$SECRET_DIR/curlrc"
          : > "$cfg"
          chmod 600 "$cfg"
          { printf 'header = "x-api-key: '
            cat "$SECRET_DIR/controlplane-api-key"
            printf '"\n'
          } >> "$cfg"

          # Port 8080 on the LoadBalancer, not 80: the chart publishes the Service
          # on controlplane.service.port, which is 8080, and a Service of type
          # LoadBalancer forwards the port it declares.
          url="http://$ip:8080/v1/agents?limit=1"

          # The IP appears before the backend is healthy, so retry: a fresh GCP
          # forwarding rule commonly answers nothing at all for a minute or two.
          code=000
          for _ in $(seq 1 30); do
            if ! code="$(curl -sS -K "$cfg" -o /dev/null -w '%{http_code}' \
                 --max-time 10 "$url")"; then
              code=000
            fi
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::GET /v1/agents?limit=1 on $ip:8080 answered $code, wanted 200"
            echo "000 means nothing answered — the load balancer's backend is still" >&2
            echo "unhealthy or the Service selects no ready pod. 401 means the" >&2
            echo "deployed controlplane-api-key is not the one this job read." >&2
            kubectl get pods --namespace "$K8S_NAMESPACE" >&2
            exit 1
          fi

          # The other half, and the one that matters most for an address on the
          # public internet: the same request WITHOUT the config file must be
          # REFUSED. Assigned exactly like the loop above and for the same
          # reason — curl prints `000` on a connection failure AND exits
          # non-zero, so `$(… || echo 000)` yields "000\n000" and every later
          # comparison against a single status is then false. A check that
          # cannot fail is worse than no check.
          if ! open="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url")"; then
            open=000
          fi
          # 401, not merely "not 200": `requireAPIKey` (internal/api/auth.go)
          # answers a missing x-api-key with 401 authentication_error, so that is
          # the answer this proves. `000` — nothing answered — would say nothing
          # at all about whether the API is guarded, and is exactly what a
          # transient blip produces.
          if [ "$open" != "401" ]; then
            echo "::error::$ip:8080 answered $open with NO api key, wanted 401"
            echo "200 means the API is unguarded. 000 means nothing answered, so" >&2
            echo "this check proved nothing about authentication." >&2
            exit 1
          fi

          echo "deployed $GITHUB_SHA — http://$ip:8080 answers 200 with a key, $open without one"

      # The runner is ephemeral, so this is hygiene rather than protection — but
      # it is the step that keeps that true if this workflow ever moves to a
      # self-hosted runner, where the working directory outlives the job.
      - name: Shred the fetched credentials
        if: always()
        # Guarded, because the step also runs when the fetch never got far enough
        # to set SECRET_DIR — and `rm -rf ""` fails, which would turn a clean
        # early exit into a red cleanup step on top of it.
        run: |
          if [ -n "${SECRET_DIR:-}" ]; then rm -rf "$SECRET_DIR"; fi
