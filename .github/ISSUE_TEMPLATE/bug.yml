name: Report a bug
description: Report behavior that does not work as expected.
type: Bug
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Choose p0 for critical, urgent work, p1 for important work, or p2 for work that can wait.
      options:
        - p0
        - p1
        - p2
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Choose easy if AI can proceed directly, medium if AI must write a plan first, or hard if a person must make a decision.
      options:
        - easy
        - medium
        - hard
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Bug details
      description: Give the steps to reproduce the problem, the expected result and the actual result.
    validations:
      required: true
