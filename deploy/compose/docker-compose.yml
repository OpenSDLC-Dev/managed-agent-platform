# Local development stack: the three server processes (controlplane + brain +
# executor) against a Postgres, a MinIO (object storage for skill archives),
# and an OpenBao (transit cipher for vault credential material,
# docs/plan/12_vaults-credentials.md), with an optional Jaeger for traces.
# This is the
# compose companion to deploy/helm — the same binaries, wired for a laptop.
# Quick start and configuration: see deploy/compose/README.md.
#
# The BYOC worker is intentionally excluded — it runs on your own compute, not here.

name: managed-agent-platform

# Shared build + wiring for the three app services; each overrides `command`.
x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: managed-agent-platform:local
  environment: &app-env
    # POSTGRES_PASSWORD is embedded in this DSN, so keep it URL-safe (no @ : / ? # % or spaces).
    DATABASE_URL: postgres://map:${POSTGRES_PASSWORD:-map}@postgres:5432/managed_agent_platform?sslmode=disable
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-map}
      POSTGRES_DB: managed_agent_platform
    # Every binary auto-applies migrations on connect (advisory-locked), so no
    # separate migrate step; the app services just wait for Postgres to be ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d managed_agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    # Object storage for the skills registry (docs/plan/06_skills.md): skill
    # archives live here, not in Postgres. The controlplane consumes it via
    # the BLOB_* env below. Same pinned release as the helm default and the
    # blobtest contract harness.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-map}
      # MinIO requires a root password of at least 8 characters.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-map-blob-dev}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - miniodata:/data

  openbao:
    # Transit cipher for vault credential material (docs/plan/12, D1/D2):
    # ciphertext stays in Postgres, this holds only the transit key. Same
    # pinned release as the helm default and the secretstest contract harness.
    # Persistent file storage + a static (KMS-free) auto-unseal whose key
    # comes from the environment — dev-grade defaults, like the MinIO
    # password above; production points externalOpenBao / BAO_ADDR at a
    # managed instance instead.
    image: openbao/openbao:2.6.1
    command: server
    cap_add:
      - IPC_LOCK
    environment:
      # 32 bytes, base64. The committed default is a well-known dev value —
      # rotate via .env for anything beyond a laptop.
      BAO_STATIC_KEY: ${BAO_STATIC_KEY:-bWFwLW9wZW5iYW8tZGV2LXN0YXRpYy1zZWFsLWtleSE=}
      BAO_LOCAL_CONFIG: >-
        {"storage":{"file":{"path":"/openbao/file"}},
         "listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],
         "seal":{"static":{"current_key_id":"dev-1","current_key":"env://BAO_STATIC_KEY"}}}
    healthcheck:
      # 200 whatever the init/seal state: openbao-init (below) handles the
      # one-time initialization once the listener answers.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - baodata:/openbao/file

  openbao-init:
    # One-shot: initializes the bundled OpenBao on first boot (root token and
    # recovery keys land on the baoinit volume — dev-grade convenience, the
    # documented trade-off of a self-unsealing local stack), then idempotently
    # ensures the transit engine and the deterministic platform token the app
    # services authenticate with. Re-runs on every `compose up` to renew the
    # periodic token.
    image: openbao/openbao:2.6.1
    restart: "no"
    # Root only to own the baoinit volume (the image's default user cannot
    # write a fresh named volume); the server container keeps its own user.
    user: "0:0"
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_PLATFORM_TOKEN: ${BAO_PLATFORM_TOKEN:-map-bao-dev-token}
      # The init policy is scoped to exactly this key — keep it in lockstep
      # with the app services' BAO_TRANSIT_KEY below.
      BAO_TRANSIT_KEY: ${BAO_TRANSIT_KEY:-map-secrets}
    entrypoint: ["/bin/sh", "/init/openbao-init.sh"]
    volumes:
      - ./openbao-init.sh:/init/openbao-init.sh:ro
      - baoinit:/openbao/init

  controlplane:
    <<: *app
    command: /controlplane
    environment:
      <<: *app-env
      CONTROLPLANE_API_KEY: ${CONTROLPLANE_API_KEY:?set CONTROLPLANE_API_KEY in .env}
      CONTROLPLANE_ADDR: ":8080"
      # Skill archives go to the bundled MinIO (plain HTTP inside the network).
      BLOB_ENDPOINT: minio:9000
      BLOB_ACCESS_KEY: ${MINIO_ROOT_USER:-map}
      BLOB_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-map-blob-dev}
      BLOB_BUCKET: map-blob
      BLOB_TLS: "false"
      # Vault credential material is encrypted through the bundled OpenBao's
      # transit engine; the token is the deterministic one openbao-init mints.
      SECRETS_BACKEND: openbao
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_PLATFORM_TOKEN:-map-bao-dev-token}
      BAO_TRANSIT_KEY: ${BAO_TRANSIT_KEY:-map-secrets}
      # Human SSO (docs/plan/31_console-sso-rbac.md, #56). Empty is disabled,
      # which is the default: with IDENTITY_MODE unset the control plane reads
      # none of the rest and management auth stays x-api-key only. The `iam`
      # profile below sets these; see README.md's "Single sign-on" section.
      IDENTITY_MODE: ${IDENTITY_MODE:-}
      IDENTITY_OIDC_ISSUER: ${IDENTITY_OIDC_ISSUER:-}
      IDENTITY_OIDC_AUDIENCE: ${IDENTITY_OIDC_AUDIENCE:-}
      IDENTITY_OIDC_JWKS_URL: ${IDENTITY_OIDC_JWKS_URL:-}
      IDENTITY_CLAIM_ROLES: ${IDENTITY_CLAIM_ROLES:-}
      IDENTITY_ROLE_MAP: ${IDENTITY_ROLE_MAP:-}
      # The bundled IdP's certificate is issued by the proxy's own local CA, so
      # the control plane has to trust it to fetch JWKS over TLS. Empty by
      # default, and deliberately not defaulted to the CA path: SSL_CERT_FILE
      # REPLACES Go's default certificate-FILE list rather than adding to it
      # (crypto/x509 loadSystemRoots), so pointing it at the CA is only survivable
      # because the separate directory scan of /etc/ssl/certs still finds the
      # public roots. That is a property of this image — debian:stable-slim with
      # ca-certificates — not of the configuration, and a slimmer base whose roots
      # are only a file would silently lose every public root for outbound TLS to
      # MinIO, the model endpoint, OTLP and MCP. The `iam` profile's seventh
      # variable supplies it; see .env.example.
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
    volumes:
      # Read-only: the control plane consumes the CA the proxy generates.
      - idpca:/etc/idp-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      # required: false is load-bearing, not defensive. A profiled service named
      # as a hard dependency makes `docker compose config` fail for the DEFAULT
      # project ("depends on undefined service"), which is CI's first compose
      # step. With it, the default stack ignores idp entirely and `--profile iam`
      # still waits for it to be healthy.
      idp:
        condition: service_healthy
        required: false
    ports:
      # Bound to loopback by default: the committed CONTROLPLANE_API_KEY is a
      # well-known placeholder, so the API must not be reachable from the LAN.
      # Set CONTROLPLANE_BIND=0.0.0.0 (with a real key) to expose it deliberately.
      - "${CONTROLPLANE_BIND:-127.0.0.1}:${CONTROLPLANE_PORT:-8080}:8080"

  brain:
    <<: *app
    command: /brain
    environment:
      <<: *app-env
      MODEL_PROVIDERS_PATH: /etc/map/model-providers.json
      # File-rubric outcome snapshots are read from the same bundled MinIO the
      # controlplane writes them to; unset BLOB_ENDPOINT and file rubrics
      # grade from the outcome description alone (plan 21 slice 3).
      BLOB_ENDPOINT: minio:9000
      BLOB_ACCESS_KEY: ${MINIO_ROOT_USER:-map}
      BLOB_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-map-blob-dev}
      BLOB_BUCKET: map-blob
      BLOB_TLS: "false"
    # An explicit depends_on replaces the anchor's, so postgres is restated.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # The brain's model routing (a JSON array — see internal/provider LoadRoutes).
      # Defaults to the committed example so the stack comes up out of the box;
      # set MODEL_PROVIDERS_FILE=model-providers.json (after copying + editing it)
      # to point at a real endpoint. Referencing an always-present file avoids
      # Docker silently creating a directory when the source is missing.
      - ./${MODEL_PROVIDERS_FILE:-model-providers.example.json}:/etc/map/model-providers.json:ro

  executor:
    <<: *app
    command: /executor
    environment:
      <<: *app-env
      SANDBOX_BACKEND: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      # Base image for the per-session sandbox containers the executor launches.
      EXECUTOR_IMAGE: ${EXECUTOR_IMAGE:-debian:stable-slim}
      # How often the reaper sweeps this daemon's sandboxes for sessions whose
      # database lifecycle says they may be destroyed (plan 24). Empty = the
      # binary's 1m default.
      EXECUTOR_REAP_INTERVAL: ${EXECUTOR_REAP_INTERVAL:-}
      EXECUTOR_CHECKPOINT_MAX_BYTES: ${EXECUTOR_CHECKPOINT_MAX_BYTES:-}
      EXECUTOR_SANDBOX_IDLE_TTL: ${EXECUTOR_SANDBOX_IDLE_TTL:-}
      # Budgets for cloning a github_repository session resource (plan 25). Both
      # are per repository and metered in flight, so a repository that outgrows
      # them is abandoned mid-clone rather than after. Empty = the binary's
      # defaults, 1 GiB and 5m.
      EXECUTOR_REPO_CLONE_MAX_BYTES: ${EXECUTOR_REPO_CLONE_MAX_BYTES:-}
      EXECUTOR_REPO_CLONE_TIMEOUT: ${EXECUTOR_REPO_CLONE_TIMEOUT:-}
      # One MCP discovery pass, across every server a session's agent declares
      # (plan 29). The dials are serial and this process runs one work item at a
      # time, so the budget is what keeps a server that accepts a connection and
      # never answers from holding every other session's work behind it. Empty =
      # the binary's default, 5m.
      EXECUTOR_MCP_PASS_TIMEOUT: ${EXECUTOR_MCP_PASS_TIMEOUT:-}
      # Sandbox containment (#65). The executor applies its own defaults when
      # these are unset — 512 processes, 2 CPUs, and the NET_RAW/SETUID/SETGID
      # drops — so they are here to be *lowered* or turned off (0, or `none` for
      # the capabilities), not to switch containment on. The two that are off by
      # default are opt-in because they need an image that tolerates them:
      # SANDBOX_MEMORY_BYTES (an OOM kill mid-task) and SANDBOX_READONLY_ROOTFS /
      # SANDBOX_RUN_AS_USER (a uid that can reach the workdir).
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-}
      SANDBOX_CPU_MILLIS: ${SANDBOX_CPU_MILLIS:-}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-}
      SANDBOX_CAP_DROP: ${SANDBOX_CAP_DROP:-}
      SANDBOX_READONLY_ROOTFS: ${SANDBOX_READONLY_ROOTFS:-}
      SANDBOX_RUN_AS_USER: ${SANDBOX_RUN_AS_USER:-}
      # Skill archives come from the same bundled MinIO the controlplane
      # writes; unset BLOB_ENDPOINT and the executor skips materialization.
      BLOB_ENDPOINT: minio:9000
      BLOB_ACCESS_KEY: ${MINIO_ROOT_USER:-map}
      BLOB_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-map-blob-dev}
      BLOB_BUCKET: map-blob
      BLOB_TLS: "false"
      # Same cipher wiring as the controlplane, constructed for startup
      # validation parity — egress substitution decrypts controlplane-side,
      # for the per-session gate (docs/plan/12).
      SECRETS_BACKEND: openbao
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_PLATFORM_TOKEN:-map-bao-dev-token}
      BAO_TRANSIT_KEY: ${BAO_TRANSIT_KEY:-map-secrets}
      # Opt into the per-session egress gate — both URL and image must be set;
      # either alone keeps the pre-gate fail-closed behavior (limited = no
      # network). The gate fetches its policy from the controlplane by compose
      # DNS name, so it joins the stack's network (named explicitly under
      # `networks:` below) rather than the daemon's default bridge.
      CONTROLPLANE_URL: http://controlplane:8080
      EXECUTOR_GATE_IMAGE: managed-agent-platform-gate:local
      SANDBOX_DOCKER_GATE_NETWORK: managed-agent-platform_default
      # Web tool backends (docs/plan/15_web-tools.md). Empty TAVILY_API_KEY
      # leaves web_search unconfigured; empty JINA_API_KEY with no
      # WEBFETCH_BASE_URL leaves web_fetch unconfigured (each answers is_error
      # naming what is missing). WEBTOOL_ALLOWED_DOMAINS (comma-separated)
      # bounds both tools' hosts; empty = unrestricted. Filled from the host
      # env or a compose-side .env — never committed.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      WEBSEARCH_BASE_URL: ${WEBSEARCH_BASE_URL:-}
      WEBFETCH_BASE_URL: ${WEBFETCH_BASE_URL:-}
      WEBTOOL_ALLOWED_DOMAINS: ${WEBTOOL_ALLOWED_DOMAINS:-}
    # An explicit depends_on replaces the anchor's, so postgres is restated.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      gate-image:
        condition: service_completed_successfully
    volumes:
      # The docker sandbox backend drives the host daemon to run sibling sandbox
      # containers. Local-dev convenience; the production path uses the k8s backend.
      - /var/run/docker.sock:/var/run/docker.sock

  # Builds the per-session egress-gate image onto the host daemon, then exits.
  # The executor launches gate containers as host-daemon siblings (like the
  # sandboxes themselves), so the tag must exist on the host daemon before the
  # first gate-needing session — a local-only tag cannot be pulled.
  gate-image:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: gate
    image: managed-agent-platform-gate:local
    entrypoint: ["/bin/true"]
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP/gRPC (point OTEL_EXPORTER_OTLP_ENDPOINT at jaeger:4317)

  # The bundled identity provider (docs/plan/31_console-sso-rbac.md, #56): a
  # local-account IdP so "the platform's default IAM works out of the box" is
  # true on a laptop. Enterprises federating their own provider point
  # IDENTITY_OIDC_ISSUER straight at it and never start this profile.
  #
  # Unpublished on purpose — only the proxy below is reachable. Casdoor serves
  # its API and UI from one port, and several of its routes are the SAML/CAS
  # surfaces we refuse to expose (VU#780781); publishing 8000 here would put
  # them back on the network beside the login page.
  casdoor:
    image: casbin/casdoor:3.152.0
    profiles: ["iam"]
    # The STANDARD image: ENTRYPOINT ["/server"], so this is an argument to the
    # server. The ALLINONE image's entrypoint drops "$@" and would swallow it,
    # then silently fall back to SQLite.
    command: ["--createDatabase=true"]
    environment:
      # Casdoor reads conf/app.conf, but conf.GetConfigString consults the
      # environment first for every key, so the whole configuration lives here
      # and no config file is mounted.
      driverName: postgres
      # dbname= inside the DSN is doubly load-bearing. Postgres does not take the
      # separate dbName key into the DSN, and refineDataSourceNameForPostgres
      # rewrites `dbname=<x>` to `dbname=postgres` to reach the maintenance
      # database for CREATE DATABASE — with no dbname= token that rewrite is a
      # no-op and the create runs against the wrong database. host must not be
      # localhost: ReplaceDataSourceNameByDocker rewrites that to 172.17.0.1.
      dataSourceName: "user=map password=${POSTGRES_PASSWORD:-map} host=postgres port=5432 sslmode=disable dbname=casdoor"
      # And dbName is still required despite the above: InitAdapter passes it to
      # CREATE DATABASE "<dbName>", which panics on an empty string.
      dbName: casdoor
      # Becomes the `iss` claim, so it must equal IDENTITY_OIDC_ISSUER byte for
      # byte. Left empty Casdoor derives the issuer from the request Host header
      # and `iss` varies per client, which the verifier's exact comparison
      # rejects. This is the URL the BROWSER uses; the control plane reaches
      # JWKS over TLS through the proxy instead (IDENTITY_OIDC_JWKS_URL).
      origin: ${IDENTITY_OIDC_ISSUER:-http://localhost:8000}
      httpport: "8000"
      initDataFile: /init_data.json
      # false is the shipped default and is kept deliberately, because it is the
      # only setting under which the seed owns built-in/admin. Casdoor's InitDb()
      # creates that account — a global administrator, password 123, documented
      # publicly — BEFORE it reads this file, so with true our entry for it is
      # skipped and the default credential survives every boot. Measured both
      # ways against 3.152.0: with true the stored hash stays Casdoor's, with
      # false it is ours and 123 is refused.
      #
      # The cost is bounded and was measured too: on restart, entities named in
      # the seed are re-applied, so edits to those four revert; entities the seed
      # does not name are untouched. A user added in the UI survives.
      initDataNewOnly: "false"
      # Ships as a file logger writing under /logs, which uid 1000 cannot create
      # in a root-owned "/". Console keeps it in `docker compose logs` anyway.
      logConfig: '{"adapter":"console"}'
    volumes:
      - ./casdoor-init-data.json:/init_data.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The only way in. Two jobs: refuse the SAML and CAS surfaces, and terminate
  # TLS for the control plane — internal/identity/fetch.go requires an https
  # JWKS URL and its dial guard then refuses loopback addresses outright, so a
  # plain-HTTP IdP cannot be wired to this platform at all.
  idp:
    image: caddy:2.10-alpine
    profiles: ["iam"]
    volumes:
      - ./idp-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's local CA lives here and is generated on first boot, so no private
      # key is committed. The control plane mounts this read-only to trust it.
      - idpca:/data
    ports:
      # Loopback only: the seeded accounts are well-known dev credentials.
      - "${IDP_BIND:-127.0.0.1}:${IDP_PORT:-8000}:8000"
    healthcheck:
      # Proves the whole chain the control plane depends on — proxy, Casdoor, and
      # the key set itself — so `depends_on: idp: service_healthy` means the
      # verifier's warming fetch at startup will find keys rather than fail boot.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/.well-known/jwks"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      casdoor:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  baodata:
  baoinit:
  idpca:

networks:
  # Named explicitly so the executor's SANDBOX_DOCKER_GATE_NETWORK above can
  # reference it verbatim, whatever COMPOSE_PROJECT_NAME says.
  default:
    name: managed-agent-platform_default
