# Helm values for the staging deployment `.github/workflows/deploy.yml` installs.
#
# This is **mode 2** — Cloud SQL, Cloud Storage and Cloud KMS behind a pre-created
# Secret — and its shape is the one that was actually installed rather than a
# plausible one: `helm upgrade --install map … -f <this> --wait --atomic
# --timeout 10m` returned 0 against the staging cluster, all three Deployments
# became Ready, and `GET /v1/agents?limit=1` on the LoadBalancer answered 200
# with a key and 401 without one.
#
# That run used this file with its five identifying values still written out.
# They are placeholders now (see below) and the workflow supplies the real ones,
# so the acceptance record covers every line here EXCEPT those five — and the
# five are re-proved on every deploy, by two different means rather than one.
# The `identity:` block postdates that run entirely and is not covered by it:
# it says so where it sits, along with what it presumes that this environment
# does not yet provide.
# The three IDENTITIES are read back out of the cluster by the step after
# `helm upgrade`, which compares each ServiceAccount's annotation against the
# variable it came from. The two IMAGE halves are not read back and do not need
# to be: an override that failed to land leaves `registry.invalid`, the pods
# cannot pull, and `--wait --atomic` rolls the release back before that step is
# reached.
#
# **It is a reference deployment, not this cluster's values file.** Every value
# below that would name an operator — the image registry and repository, and the
# three Workload-Identity service accounts — is written here against the neutral
# project `your-project`, and the workflow overrides all five with `--set-string`
# from repository variables (`ARTIFACT_REGISTRY`, `CONTROLPLANE_SERVICE_ACCOUNT`,
# `BRAIN_SERVICE_ACCOUNT`, `EXECUTOR_SERVICE_ACCOUNT`). This repository is public,
# and one that names one operator's project, registry and identities hands a
# reader a target list and ties the project to a cluster nobody cloning it can
# reach.
#
# The `identity:` block adds two more such values — the IAP audience carries a
# project NUMBER, and the role map names a person — and they are placeholders for
# the same reason. What differs is that **no repository variable supplies the
# real ones today**: a deployment that actually puts IAP in front sets them here
# or on the `helm` command line, which is why both placeholders are written to
# fail closed rather than to look plausible.
#
# The keys stay here rather than being deleted, and that is the deliberate half
# of the choice: `helm template -f <this>` on its own is what CI runs against this
# file, and a file with `image.registry` removed renders against the chart's
# ghcr.io defaults while a file with the annotations removed renders a
# ServiceAccount with no identity — so what is meant to be the worked example of
# mode 2 would document a deployment that cannot start.
#
# The two halves do NOT fail the same way if an override is ever dropped, and
# saying they do would be the more comfortable claim rather than the true one.
# The IMAGE half fails closed by construction: `registry.invalid` can never
# resolve, because RFC 2606 reserves the `.invalid` TLD precisely so no name
# under it can be registered — so the pods cannot pull and `--wait --atomic`
# rolls the release back. The IDENTITY half does not fail closed at all for the
# brain: read the note on `brain.serviceAccount` below, and
# internal/brain/grader.go, which downgrades a blob read it cannot make to a
# warning and grades on. The pod starts, the release completes, and the run is
# green. That is why the workflow reads the three annotations back out of the
# cluster after the upgrade instead of trusting that it set them.
#
# The registry host is where that distinction is load-bearing. A plausible-looking
# `us-central1-docker.pkg.dev/your-project/…` would be a real Artifact Registry
# path in whatever project happens to own the id `your-project` — a globally
# unique namespace anyone may register — so a reader who ran this file verbatim,
# or an edit that dropped the `image.*` override, could silently pull and run a
# stranger's images instead of failing. An unresolvable host cannot do that.
#
# Mode 1 (bundled Postgres/MinIO/OpenBao) is not what this environment runs. It is
# the fewest moving parts and the right first proof, but a pipeline that installs
# it every push keeps the platform's data in three StatefulSets whose
# PersistentVolumes the teardown section of docs/deploy-gcp.md warns about, and
# leaves Cloud SQL — which `environment/` creates and `make gcp-db-init` has
# already prepared — sitting unused.
#
# Every coordinate below came from `terraform -chdir=deploy/gcp/environment
# output`, transcribed rather than generated — the identifying five as the
# repository variables the workflow overrides them from, the rest as the literals
# here. If `main.tf` changes the taint, the registry, or a service account, there
# are two places to change: this file for what a rebuild does not identify, and
# the repository variables for what it does.
#
# What is deliberately NOT here:
#
#   * Every credential — and in mode 2 that is not a list of values withheld, it
#     is a whole mechanism moved: the chart writes no Secret at all, so there is
#     nothing here to withhold. `controlplane-api-key`, `database-url` and
#     `model-providers.json` reach the cluster in the pre-created Secret named
#     below, which the workflow assembles from Secret Manager at deploy time.
#   * `image.tag` and `executor.gateImage`. Both name a build, and the workflow
#     sets both from the *same* commit SHA it built with. An empty `image.tag`
#     falls back to the chart's appVersion, which this Artifact Registry does not
#     hold — all three platform pods sit in ImagePullBackOff. Pinning a tag in
#     this file would be worse: it would deploy whatever commit was current when
#     the line was last edited.

# The chart composes each component's image as {registry}/{repository}/{component}:{tag}
# (templates/_helpers.tpl, "map.image"), so an Artifact Registry prefix splits at
# the FIRST slash and not anywhere else: a real one reads
# `LOCATION-docker.pkg.dev` / `PROJECT/REPOSITORY`. Get the split wrong — put the
# project into `registry`, say — and Helm renders a reference that is merely wrong
# rather than invalid, so the render succeeds and the pods fail to pull. That is
# why the workflow derives both halves from the one `ARTIFACT_REGISTRY` variable
# with `${…%%/*}` and `${…#*/}` rather than carrying two variables that could
# disagree.
#
# `registry.invalid` rather than a plausible `LOCATION-docker.pkg.dev`, and that
# is the placeholder doing work rather than standing in: see the header. The
# repository half keeps the real two-segment shape, because that is the half the
# split lesson above is about.
image:
  registry: registry.invalid
  repository: your-project/map-images

# The switch that selects mode 2. Set, the chart renders NO Secret of its own and
# every process reads its configuration from this one instead. The workflow's
# "Assemble the mode-2 Secret" step creates it in namespace `map` with exactly the
# seven keys the chart's `map.secretsEnv` helper looks for:
#
#   controlplane-api-key   the management API key          (Secret Manager)
#   database-url           the Cloud SQL DSN                (Secret Manager)
#   model-providers.json   the model routes, a JSON array   (Secret Manager)
#   blob-backend           gcs                              (literal)
#   blob-bucket            the GCS bucket, from BLOB_BUCKET (literal)
#   secrets-backend        gcpkms                           (literal)
#   gcpkms-key-name        the full CryptoKey resource name (literal)
#
# Object storage carries no credential key since #240 — the workloads authenticate
# to GCS as themselves through Workload Identity, which is what the three
# annotations below are for. `gcsObjectStorage.enabled` is deliberately left false:
# it is the mode-1 route to the same bucket, and the chart refuses it alongside
# `existingSecret` because in this mode the value would select nothing.
existingSecret: map-platform

# Not tidiness — the chart fails the render on each of these while `existingSecret`
# is set (templates/secret.yaml's first three guards), because it will not deploy
# two of anything. Mode 2's Postgres is Cloud SQL, its object store is the GCS
# bucket, and its credential cipher is Cloud KMS.
postgresql:
  enabled: false
minio:
  enabled: false
openbao:
  enabled: false

# The Cloud SQL Auth Proxy, as a native sidecar in all three deployments. What it
# buys is that no address is written down anywhere: the PROXY is given the
# instance's connection name, and the DSN then names the proxy's loopback socket
# rather than the database. A rebuilt Cloud SQL instance gets a new private IP —
# the third thing a rebuild moves, under "Continuous delivery" in this
# directory's README — and a connection name is what a rebuild does not change.
#
# `instanceConnectionName` is an operator identifier, so the value here is the
# same NEUTRAL placeholder the three service-account annotations below carry, and
# the workflow overrides it with `--set-string` from the live instance. Like
# those annotations, the override is READ BACK after the deploy, because the
# render cannot tell a placeholder from a real name — both are well-formed.
#
# `connectionTest` is ON here, against the chart's default, and it is worth
# being exact about what that buys, because it is less than it first appears.
# The DSN now routes through the proxy, so the platform is already its own
# reachability check: it pings before serving and exits when that fails, and
# `--atomic` rolls back. A wrong instance does not deploy green here.
#
# What the flag buys is WHERE the failure appears. Without it an operator sees
# three application containers unable to reach Postgres and has to work back to
# a proxy pointed at the wrong instance; with it the sidecar exits first, naming
# the instance it could not open. And it covers the one state where nothing else
# does: a rebuild re-points `database-url` at the instance's address (the
# recovery this directory's README documents), and the proxy is then unexercised
# again until the DSN comes back — exactly the blind window the cutover had.
#
# The read-back check next to it answers a third question and neither replaces
# it: that the name the workflow RESOLVED is the name the pods GOT.
#
# A deploy run right after `make gcp-env-start` is the case that gives pause,
# and it is mostly serialised away rather than survived: `env-power.sh start`
# waits for the instance to reach RUNNABLE before it resizes a node pool, and
# `deploy.yml` skips every deploying step while the parked label is still there.
# Do NOT reach for the sidecar's restarts as the answer — the kubelet backs off
# exponentially, so the retry that would have succeeded can land after `--wait`
# has given up. RUNNABLE is the Admin API's state and not proof that Postgres
# accepts connections, so a deploy fired the instant `start` returns can still
# roll back. Re-run it; rolling back is what `--atomic` did, so nothing is left
# half-applied.
#
# `privateIP` is left at the chart's default true, which is what an instance with
# `ipv4_enabled = false` requires — the shape environment/ builds.
cloudSQLProxy:
  enabled: true
  connectionTest: true
  instanceConnectionName: your-project:us-central1:map-staging

# Single sign-on (docs/plan/31_console-sso-rbac.md, #56). On GCP the identity
# provider is Google's: IAP terminates the human login in front of the control
# plane and Cloud Identity Platform or Workspace does the SSO — so no Casdoor is
# deployed here and the chart's `casdoor.enabled` stays at its default false.
#
# **This block postdates the acceptance run the header describes**, and it
# configures the platform half of a front door this environment does not have
# yet: the control plane is published as a plain-HTTP L4 LoadBalancer with no
# domain (`controlplane.service.type` below), and IAP lives on an HTTPS load
# balancer. So what deploys today is the lane, with nothing in front of it to
# mint an assertion. Machine credentials are untouched by that — `x-api-key` and
# worker environment keys resolve on their own lanes before any assertion is
# consulted — which is why the pipeline's smoke check behaves identically with
# the lane on.
#
# `trusted_proxy` + `gcp-iap` is one preset and two consequences worth stating.
#
# The preset fixes the assertion header (`x-goog-iap-jwt-assertion`), the issuer
# (`https://cloud.google.com/iap`), the key set (Google's global gstatic JWK set)
# and the algorithm (ES256) in CODE — internal/identity/preset.go — and
# internal/identity/config.go REFUSES a deployment that tries to override one:
# `IDENTITY_PROXY_PRESET=gcp-iap supplies IDENTITY_PROXY_HEADER; unset it` is a
# boot error, not a warning. `proxy.header`, `proxy.issuer`, `proxy.keysUrl` and
# `proxy.algs` are therefore deliberately absent below rather than forgotten.
#
# And it makes the control plane's STARTUP depend on reaching www.gstatic.com:
# the verifier warms its key set at construction, and a fetch that fails is a
# boot error rather than a 500 on the first human's first request
# (internal/identity/verifier.go, New). The nodes are private and egress through
# Cloud NAT, so the reach exists — but it is a new dependency of a boot that used
# to need only Postgres, and `helm upgrade --wait --atomic` turns a failure of it
# into a rolled-back deploy.
#
# Those two facts together are why `mode` below ships EMPTY, and it is the one
# value in this block a real deployment changes. There is no IAP in front of this
# environment, so an enabled lane grants no human anything today; what it would
# add is a boot dependency on an external host to a deploy that needs only
# Postgres, on the `--wait --atomic` path where a transient fetch failure becomes
# a rollback. Cost with no benefit until the HTTPS front door exists. The keys
# stay, spelled and placed exactly as a working deployment wants them, so turning
# the lane on is `mode: trusted_proxy` plus a real audience — one line and one
# value, not a reconstruction of this block. It also keeps this file consistent
# with the chart, where `identity.mode` and `casdoor.enabled` are both off by
# default and nothing in the platform turns itself on.
identity:
  mode: "" # IDENTITY_MODE — `trusted_proxy` once IAP fronts the control plane
  proxy:
    preset: gcp-iap # IDENTITY_PROXY_PRESET
    # The one verification parameter the preset cannot supply, and the entire
    # tenant boundary of this mode. The gstatic key set is global across every
    # Google Cloud customer, so another customer's IAP assertion is signed by a
    # key this deployment trusts and is refused by `aud` and nothing else
    # (internal/identity/preset.go states exactly this). The header is also
    # caller-supplied on a public address here, so what refuses a forged one is
    # the signature over Google's key set plus this value — there is no third
    # check behind them.
    #
    # A placeholder that fails CLOSED, in the same spirit as `registry.invalid`
    # above: project number 0 and backend service 0 name nothing that can exist,
    # so every assertion fails `aud`, while the value still satisfies the
    # `/projects/` shape check that would otherwise refuse the boot. The real one
    # is `terraform -chdir=deploy/gcp/environment output -raw
    # identity_proxy_audience`, once `iap_backend_service` names the backend
    # service IAP is enabled on.
    audience: "/projects/0/global/backendServices/0" # IDENTITY_PROXY_AUDIENCE
  claims:
    # IAP's assertion identifies the PERSON — subject and email — rather than the
    # directory groups they belong to, so the roles claim is the email claim and
    # the map below names people. Nothing in the platform presumes that: an IdP
    # that does place a group claim in the assertion is configured by pointing
    # this at its name instead.
    roles: email # IDENTITY_CLAIM_ROLES
  # Claim value → role, which the chart joins into IDENTITY_ROLE_MAP. Placeholder,
  # and fail-closed for the reason the audience is: RFC 2606 reserves `.invalid`,
  # so no mailbox under it can exist and this entry can never match a verified
  # assertion.
  #
  # A claim value may contain neither `,` nor `=` — parseRoleMap in
  # internal/identity/config.go splits on both, and a value carrying one fails
  # startup rather than mapping something unintended. Email and Google group
  # addresses are unaffected.
  #
  # Mapping is the authorization; IAP membership is only admission. An
  # authenticated human whose email matches no entry here holds no role and is
  # refused by every role-gated route — 403, not 401.
  roleMap:
    "admin@your-domain.invalid": admin

controlplane:
  # LoadBalancer is what makes the API reachable at all: this deployment has no
  # domain, so there is no Ingress or Gateway to put in front of it and nothing
  # for a certificate to be issued against. GKE gives the Service a bare external
  # IP and the pipeline's smoke check curls it.
  #
  # It is PLAIN HTTP, on purpose, and it is a real cost, not an oversight:
  # `controlplane` is an `http.Server` with no TLS configuration (docs/deploy-gcp.md,
  # "Exposing the control plane"), so the management `x-api-key`, every prompt and
  # output, and the whole SSE stream cross the internet in cleartext. Accepted for a
  # staging environment holding nothing anyone would miss; the moment this
  # environment gets a domain, the fix is a GKE Gateway terminating TLS and this
  # value back to ClusterIP.
  service:
    type: LoadBalancer
  # Workload Identity needs BOTH halves and `environment/` applies only one: it
  # creates the IAM binding that lets this release's Kubernetes ServiceAccount
  # impersonate the Google one. The annotation is the other half, and it lives
  # here. Missing, ADC fails at pod startup rather than denying a permission later.
  #
  # The value is an EXAMPLE — the workflow overrides it from the
  # `CONTROLPLANE_SERVICE_ACCOUNT` repository variable. Left as written it names
  # an account that does not exist, which is a pod that never starts, not a pod
  # that starts with the wrong identity.
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: map-controlplane@your-project.iam.gserviceaccount.com
  # A request, not a limit. The request is what the scheduler reads, and a
  # container with none is BestEffort: it costs the scheduler nothing and the
  # kubelet evicts it first under node pressure. The numbers are floors that make
  # placement deterministic, not measurements — and no limit is set precisely
  # because nothing here has a measured working set, and a guessed limit is an
  # OOMKill nobody asked for.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

brain:
  # **Apply this one.** It is the annotation people skip, because it used to exist
  # only for the Cloud SQL Auth Proxy, which this deployment did not run. Two
  # things ended that, and either alone is enough. The proxy is now on, above —
  # and before it, #240: the brain reads file bytes out of the blob bucket
  # to grade rubrics, and its account is what carries `roles/storage.objectViewer`
  # there. Omitting it does not fail — the render succeeds, the pod starts, and the
  # brain's reads degrade to grading against the outcome description alone. Silent
  # is the reason to set it now rather than to discover it from a grade.
  # Example value; the workflow overrides it from `BRAIN_SERVICE_ACCOUNT`.
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: map-brain@your-project.iam.gserviceaccount.com
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

executor:
  # This identity is what the sandbox path and the executor's own blob access
  # authenticate as; the IAM binding for it is already applied by `environment/`.
  # Example value; the workflow overrides it from `EXECUTOR_SERVICE_ACCOUNT`.
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: map-executor@your-project.iam.gserviceaccount.com
  # No memory limit here either, and the reason is more than the one above: this
  # is the process that moves the big payloads, but a checkpoint restore spools to
  # a temp FILE (internal/executor/checkpoint.go) and a repository clone to a temp
  # DIRECTORY (repoclone.go), so the budgets those paths enforce —
  # EXECUTOR_CHECKPOINT_MAX_BYTES at 2 GiB, EXECUTOR_REPO_CLONE_MAX_BYTES at 1 GiB
  # per repository — are claims on the NODE's ephemeral disk, not on this pod's
  # address space. Size the node pool's boot disk for them.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# Where sandbox pods run — the PAIR, and neither half is useful alone. The
# selector finds `google_container_node_pool.sandbox`, which
# deploy/gcp/environment/main.tf labels with exactly this key and value; the
# toleration is what gets admitted onto it past the taint that same block sets.
# Ship only the tolerations and sandbox pods land on the platform pool, which is
# the pool the taint exists to protect; ship only the selector and every sandbox
# pod stays Pending forever, because nothing else tolerates that taint. This is
# the same pair `terraform output -raw helm_values_mode1` emits — mode-1 named,
# but the sandbox pool is not one of the things the two modes differ about —
# transcribed rather than generated.
sandboxPlacement:
  nodeSelector:
    map.opensdlc.dev/sandbox: "true"
  tolerations:
    - key: map.opensdlc.dev/sandbox
      operator: Equal
      value: "true"
      # GKE's node-pool API spells this NO_SCHEDULE and the Kubernetes Toleration
      # spells it NoSchedule. Not drift — two APIs.
      effect: NoSchedule
