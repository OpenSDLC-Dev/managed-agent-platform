# Default values for managed-agent-platform.
# The chart deploys the three platform processes — controlplane, brain, executor —
# plus an optional in-cluster Postgres. The BYOC worker is NOT part of this chart:
# it runs on the customer's own compute, outside the platform's cluster.

# -- Container images. Each process is pulled as a separate image at
# {registry}/{repository}/{component}:{tag} (component is controlplane|brain|executor).
# No images are published by this repository yet; build and push your own, then set
# registry/repository/tag.
image:
  registry: ghcr.io
  repository: opensdlc-dev/managed-agent-platform
  # tag defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
# -- imagePullSecrets referenced by every pod (list of {name: ...}).
imagePullSecrets: []

# -- OTLP/gRPC collector for traces, metrics, logs. Empty disables export.
# Wired into all three processes as OTEL_EXPORTER_OTLP_ENDPOINT / _INSECURE.
otlp:
  endpoint: ""
  insecure: false

# -- Bootstrap management API key (x-api-key). REQUIRED: set via --set or a values
# file, or point existingSecret at a Secret holding key `controlplane-api-key`.
# Stored in the chart's Secret when apiKey is set inline.
controlplane:
  apiKey: ""
  replicas: 1
  # -- Annotations for this component's Kubernetes ServiceAccount. The reason
  # this exists is GKE Workload Identity, which is an annotation and nothing
  # else: `iam.gke.io/gcp-service-account: NAME@PROJECT.iam.gserviceaccount.com`
  # binds this pod's identity to a Google service account, and that is how the
  # gcpKMS cipher authenticates without any key material in the Secret.
  #
  # The control plane encrypts on write and decrypts for mcp_oauth_validate, so
  # its identity needs roles/cloudkms.cryptoKeyEncrypterDecrypter on the key.
  # (The executor needs less — see its own serviceAccount block.)
  serviceAccount:
    annotations: {}
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

brain:
  replicas: 1
  # -- Annotations for this component's Kubernetes ServiceAccount — the same
  # GKE Workload Identity hook the other two carry
  # (`iam.gke.io/gcp-service-account: NAME@PROJECT.iam.gserviceaccount.com`),
  # for a different reason, and that difference is why the brain has an identity
  # of its own rather than borrowing one. The brain holds no cipher, so it needs
  # nothing from KMS. It does open the database, so under the Cloud SQL Auth
  # Proxy topology (cloudSQLProxy below) it needs a Google service account
  # holding roles/cloudsql.client — and annotating it onto the control plane's
  # would hand the brain the KMS decrypt that account carries (#269).
  serviceAccount:
    annotations: {}
  leaseTTL: ""       # e.g. "2m"; empty uses the binary default
  pollInterval: ""   # e.g. "250ms"; empty uses the binary default
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Model routes, written verbatim as a JSON array to the file the brain reads
  # (MODEL_PROVIDERS_PATH). The loader (internal/provider — LoadRoutes) requires a JSON
  # ARRAY: each entry is model (route key, "*" = default), protocol, base_url, and
  # api_key, plus optional upstream_model / headers / stall_timeout — a Go duration
  # bounding how long that endpoint may send nothing at all before the turn is abandoned
  # (default 10m; every byte received buys the budget back, so it never ends a healthy
  # turn, only a wedged one — #121) — and max_tokens, the default output cap for turns
  # that set none themselves (omitted, anthropic sends 8192 and openai defers to the
  # endpoint; must be positive — zero or negative fails the brain at startup). (The loader also accepts api_key_env,
  # but this chart injects no extra env into the brain, so supply api_key here instead.)
  # No other keys — the loader rejects unknown fields. Contains api_key, so it is stored
  # in a Secret. REQUIRED (at least one route). base_url is the API ROOT — the adapter
  # appends the protocol path (/v1/messages or /v1/chat/completions), so omit a trailing
  # /v1. Leaving upstream_model unset passes the agent's own model string through to the
  # endpoint AND into the gen_ai.request.model metric attribute; since metric attributes
  # are aggregation keys, a "*" route without upstream_model lets whoever can supply a
  # model string — via agent creation, or via a session's agent_with_overrides on create
  # or update — control your metrics backend's series count. Deliberate — set
  # upstream_model or use per-model routes if any of those paths is untrusted (#88).
  # Example:
  #   modelProviders:
  #     - model: "*"
  #       protocol: anthropic
  #       base_url: https://gateway.internal
  #       api_key: sk-...
  modelProviders: []

executor:
  replicas: 1
  # -- Annotations for this component's Kubernetes ServiceAccount. The reason
  # this exists is GKE Workload Identity, which is an annotation and nothing
  # else: `iam.gke.io/gcp-service-account: NAME@PROJECT.iam.gserviceaccount.com`
  # binds this pod's identity to a Google service account, and that is how the
  # gcpKMS cipher authenticates without any key material in the Secret.
  #
  # The executor constructs the cipher ONLY to fail fast on a misconfigured
  # backend — egress substitution decrypts control-plane side, at the
  # gate-config endpoint, never here — so the one KMS call it ever makes is the
  # startup probe's encrypt, and roles/cloudkms.cryptoKeyEncrypter is enough.
  # Pointing both components at one Google service account holding
  # EncrypterDecrypter is simpler and is what the chart README's example does;
  # two accounts is the least-privilege shape.
  serviceAccount:
    annotations: {}
  leaseTTL: ""       # EXECUTOR_LEASE_TTL, e.g. "15m"; empty uses the binary default
  pollInterval: ""   # EXECUTOR_POLL_INTERVAL, e.g. "500ms"; empty uses the binary default
  # -- Base image for the per-session sandbox pods the executor launches.
  sandboxImage: "debian:stable-slim"
  sandboxWorkdir: "/workspace"
  # -- Image carrying `ip` for the limited-networking init container.
  netSetupImage: "busybox"
  # -- Per-session egress-gate sidecar image (the `--target gate` build); full
  # ref. Setting it opts the executor into the gate: `limited` or vault-attached
  # sessions get the gate sidecar in their sandbox pod (the chart derives
  # CONTROLPLANE_URL from the controlplane Service). Empty keeps the pre-gate
  # fail-closed behavior — `limited` = the route-flush init container, no
  # credential substitution. The sidecar needs CAP_NET_ADMIN, so the release
  # namespace must not enforce the `baseline` or `restricted` Pod Security
  # levels — and it is
  # a native sidecar, so the cluster must be Kubernetes >= 1.29 (the template
  # fails the render on older clusters).
  gateImage: ""
  # -- Containment applied to every sandbox pod at provision time (#65). The
  # executor's own defaults hold where a value is empty — 2000 millicores (2
  # CPUs) and the `NET_RAW,SETUID,SETGID` capability drops — so these knobs are
  # for lowering a cap or turning one off (`0`, or `none` for capDrop), not for
  # switching containment on. A malformed value fails executor startup.
  #
  # The `memoryBytes`, `ephemeralStorageBytes`, `readOnlyRootfs` and `runAsUser`
  # half is opt-in because
  # each needs an image that tolerates it: an OOM kill lands mid-task, and a uid
  # the image did not choose must still be able to reach the workdir (a
  # read-only root supplies a world-writable emptyDir over it). Kubernetes has
  # no per-pod process limit to expose here — that is the kubelet's
  # `podPidsLimit` node setting (docs/DIVERGENCES.md).
  sandboxHardening:
    cpuMillis: ""
    memoryBytes: ""
    # -- Node-local disk cap for a sandbox, in BYTES — not a Kubernetes quantity
    # string, so `21474836480`, never `20Gi` (a quantity fails executor startup).
    # Kubernetes-only, the mirror of the absent pids knob — though for a
    # different reason: the Docker backend can express a writable-layer quota,
    # it just cannot vouch for one (storage-driver dependent), so it logs that
    # it ignored this instead. Exceeding it gets the pod
    # EVICTED by the kubelet rather than failing the write, and the request is
    # set equal to the limit, so a generous cap is a real per-pod reservation the
    # node pool has to be sized for. And it binds only where the kubelet can
    # measure local ephemeral storage — a single filesystem, a separate runtime
    # filesystem, or a split image filesystem; on any other node layout the pod
    # takes the fields and is never evicted for exceeding them.
    ephemeralStorageBytes: ""
    capDrop: ""
    readOnlyRootfs: ""
    runAsUser: ""
  # -- Extra literal env entries for the executor container, rendered verbatim.
  # The seam for deployment-shaped configuration the chart has no dedicated knob
  # for — e.g. the web tools' backends (TAVILY_API_KEY, JINA_API_KEY,
  # WEBSEARCH_BASE_URL, WEBFETCH_BASE_URL) and their operator allowlist
  # (WEBTOOL_ALLOWED_DOMAINS; docs/plan/15_web-tools.md, #225): put the keys
  # behind `valueFrom.secretKeyRef` entries here rather than inline values.
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # The executor runs sandbox pods in the release namespace via in-cluster config;
  # the chart grants it the pods / pods/exec RBAC it needs there.

# -- Hardened container runtime for sandbox pods. The sandbox runs untrusted,
# model-directed commands, so the strength of the container boundary is the
# strength of your isolation: a sandboxing runtime (gVisor, Kata) is the
# strongest lever an operator has. This block both names the RuntimeClass the
# executor puts on sandbox pods and, optionally, creates the object.
sandboxRuntimeClass:
  # -- RuntimeClass name set on every sandbox pod. Empty uses the cluster's
  # default runtime. A name no RuntimeClass defines makes the kubelet refuse the
  # pod — the fail-closed direction.
  name: ""
  # -- Also create the cluster-scoped RuntimeClass named above. Off by default:
  # it collides with another release creating the same name, the install needs
  # cluster-scope RBAC, and the nodes must already run the handler. It is
  # Helm-managed, so `helm uninstall` removes it again — which breaks any other
  # workload pointing at it. Leave this false and point `name` at a RuntimeClass
  # the cluster already owns unless this release is the one that owns it.
  create: false
  # -- CRI handler the created RuntimeClass points at; gVisor's is `runsc`.
  handler: runsc

# Where sandbox pods may run. Top-level, and NOT under `executor`, because
# `executor.nodeSelector`/`executor.tolerations` place the executor's OWN
# Deployment — a different pod, usually on a different pool. Nesting these there
# would put two unrelated meanings behind one name.
#
# Both are how a dedicated, tainted sandbox node pool is reached: the selector
# finds it, the tolerations get admitted onto it. Empty applies nothing, which is
# today's behaviour. A malformed value fails executor startup rather than
# producing a pod that sits Pending forever with nothing in the log.
sandboxPlacement:
  # -- Node labels a sandbox pod requires, as an ordinary YAML map. The chart
  # encodes it as the `key=value,key=value` the executor parses, so write it the
  # way a Kubernetes `nodeSelector` is written.
  nodeSelector: {}
  #   cloud.google.com/gke-nodepool: sandbox
  # -- Taints a sandbox pod tolerates, as an ordinary YAML list of Kubernetes
  # Toleration objects — the chart passes it through as JSON. `tolerationSeconds`
  # works, which is why this is not a flat string.
  tolerations: []
  #   - key: sandbox
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule

# -- imagePullSecrets for the sandbox PODS the executor creates — the same
# {name: ...} list shape as the top-level imagePullSecrets, which covers only
# the platform's own pods (#199). Left null it inherits the top-level list:
# sandbox pods run in the release namespace, where the same Secrets answer, and
# an operator who pointed the platform at a private registry almost always
# pulls the sandbox image from it too. An explicit [] opts sandbox pods out;
# anything other than null or a list refuses to render.
# Pod-level, so one setting also covers a limited session's net-setup image and
# a gated session's gate sidecar.
sandboxImagePullSecrets: null

# -- In-cluster Postgres. For production, disable this and point externalDatabase
# at your own managed Postgres. This is a deliberate divergence from a Postgres
# subchart: a self-hostable, air-gap-friendly platform should not require pulling
# an external chart from a repo.
postgresql:
  enabled: true
  image: postgres:16-alpine
  database: managed_agent_platform
  username: map
  # -- REQUIRED when postgresql.enabled. The chart does NOT auto-generate it: a
  # generated password is unstable under `helm template`/GitOps (each render differs),
  # which drifts from the initdb'd password and crash-loops the apps. It is embedded
  # in DATABASE_URL, so it must be URL-safe (no @ : / ? # % or spaces).
  password: ""
  storage: 8Gi
  storageClassName: ""  # empty uses the cluster default StorageClass
  resources: {}
  # Postgres listens on the standard 5432; not configurable for the bundled instance.

# -- External database, used when postgresql.enabled is false. Provide the full DSN
# inline; the chart stores it in its Secret. To manage the DSN yourself, use
# existingSecret below instead.
externalDatabase:
  url: ""

# -- Cloud SQL Auth Proxy as a sidecar in the controlplane, brain and executor
# pods: Google's documented way for a GKE workload to reach a private-IP Cloud
# SQL instance. Off by default — it is GCP-only, and mode 2 also runs without it
# (docs/deploy-gcp.md, "Connecting to a private-IP instance", #269).
#
# The proxy terminates the encrypted leg itself and offers the process a plain
# loopback socket, so the DSN — whether it comes from externalDatabase.url or
# from the pre-created Secret existingSecret names — must point at that socket:
#
#   postgres://USER:PASSWORD@127.0.0.1:5432/DATABASE?sslmode=disable
#
# The chart does not compose that DSN for you and does not refuse a wrong one,
# so pointing this at an instance while leaving the DSN on the instance's own
# address leaves a proxy nothing connects through. The reason it is not checked
# is not that it cannot be: it is that "does this DSN reach the proxy" has no
# closed grammar to test against. A DSN through the sidecar can legitimately say
# 127.0.0.1, localhost, [::1], or a unix socket path, so a host check would
# refuse working deployments — the same false-rejection this file declines to
# risk on instanceConnectionName below.
#
# `sslmode=disable` is safe there and only there: the hop it describes is a
# loopback socket inside one pod. That is why the proxy is a sidecar rather than
# a shared Deployment and Service — the tidier-looking shape puts the password,
# every query and every result on the pod network in cleartext, on the near side
# of the encryption, where neither the instance's `ssl_mode = ENCRYPTED_ONLY`
# nor `pg_stat_ssl` can see it.
#
# One switch for all three processes rather than one each, because they read a
# single `database-url` Secret key: a DSN cannot name a loopback socket for some
# pods and the instance's address for the others.
#
# The IAM half is not expressible here. Each pod's ServiceAccount must be
# annotated onto a Google service account holding `roles/cloudsql.client` — see
# the three serviceAccount.annotations blocks, and deploy/gcp/, which creates
# those accounts and their Workload Identity bindings.
cloudSQLProxy:
  enabled: false
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.24.1
  # -- PROJECT:REGION:INSTANCE — the instance's connection name, NOT an address
  # (`terraform output -raw sql_instance_connection_name`). REQUIRED when
  # enabled; the render fails without it rather than starting a proxy that has
  # no instance to reach.
  #
  # What the render checks is the SHAPE and only the shape: three or four
  # non-empty colon-separated segments (four for a legacy domain-scoped
  # project, DOMAIN:PROJECT:REGION:INSTANCE). So an address and an empty
  # segment are refused, and a well-formed name that names nothing is not —
  # that one the proxy refuses at startup, which is the right place for it:
  # encoding Google's own naming rules here would refuse a valid name the day
  # Google widens one.
  instanceConnectionName: ""
  # -- Pass `--private-ip`, which is what an instance with `ipv4_enabled = false`
  # requires — the shape deploy/gcp/ builds. Turn it off for an instance reached
  # over its public address.
  privateIP: true
  # -- Resources for the proxy container. Google's guidance is that its memory
  # scales with the number of active connections and its CPU with the volume of
  # IO, so there is no default worth hard-coding here.
  resources: {}

# -- In-cluster MinIO: S3-compatible object storage for skill archives
# (docs/plan/06_skills.md). Same shape and rationale as the bundled Postgres —
# a hand-written single-node StatefulSet, deliberately not a subchart (air-gap
# self-hosting must not require pulling an external chart), fine for dev/POC;
# production should disable it and point externalObjectStorage at storage with
# its own backup/upgrade lifecycle. The platform speaks plain S3 — any
# compatible store works.
minio:
  enabled: true
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  # -- REQUIRED when minio.enabled: the chart does NOT auto-generate credentials,
  # for the same GitOps-render-stability reason as postgresql.password. MinIO
  # requires a rootPassword of at least 8 characters.
  rootUser: ""
  rootPassword: ""
  bucket: map-blob
  storage: 8Gi
  storageClassName: ""  # empty uses the cluster default StorageClass
  resources: {}
  # MinIO listens on the standard 9000; not configurable for the bundled instance.
  # The bundled instance serves plain HTTP inside the cluster (blob-tls=false),
  # like the bundled Postgres; use externalObjectStorage with tls for TLS.

# -- External S3-compatible object storage, used when minio.enabled is false.
# endpoint is host:port (no scheme; tls picks the scheme). Leaving endpoint
# empty with minio disabled deploys without object storage: the platform runs,
# skills features are unavailable.
externalObjectStorage:
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: ""
  region: ""
  tls: true
  # -- Set when the bucket is provisioned out of band (Terraform, an operator,
  # a cloud console). The platform then neither checks for it nor creates it,
  # so its identity needs no bucket-level read for a startup check that could
  # only ever answer "yes" (#241). On AWS keep `s3:ListBucket` on the bucket
  # anyway — without it S3 answers a missing object with 403 rather than 404,
  # which the platform needs to tell absence from a denial. Requires the
  # correct `region`: without one the client resolves the bucket's location
  # before its first object request — the same bucket-level call, a moment
  # later — and the chart fails the render rather than deploy a half-kept
  # promise; with a wrong one the client can no longer self-correct, so the
  # first object request fails. That is the trade the mode makes: a wrong
  # endpoint, credential, region or bucket name surfaces on first use rather
  # than at startup. Leave false for a bucket the platform should create.
  bucketPrecreated: false

# -- Google Cloud Storage, natively (#240). The keyless object-storage mode:
# authentication is Application Default Credentials, which on GKE is a Workload
# Identity binding, so there is no access key, no secret key and no endpoint —
# nothing to distribute or rotate. Mutually exclusive with the bundled MinIO and
# with externalObjectStorage.
#
# The bucket must already exist. Nothing here creates it and nothing checks for
# it, which is precisely what keeps the deployment identity's grant to object
# permissions only: a bucket-level read would be a bucket-level privilege. A
# wrong name surfaces on first use, named rather than swallowed.
#
# Bind the identity yourself: the ServiceAccount annotations under
# controlplane/brain/executor carry the Google service account, and that account
# needs object access on this bucket (roles/storage.objectUser for controlplane
# and executor, roles/storage.objectViewer for the brain, which only reads).
# deploy/gcp/environment/iam.tf does exactly that.
gcsObjectStorage:
  enabled: false
  bucket: ""

# -- In-cluster OpenBao: the transit cipher for vault credential material
# (docs/plan/12_vaults-credentials.md). Same shape and rationale as the bundled
# Postgres and MinIO — a hand-written single-node StatefulSet, deliberately not
# a subchart, fine for dev/POC; production should disable it and point
# externalOpenBao at an OpenBao/Vault with its own backup/HA lifecycle. The
# platform speaks the plain Vault-compatible transit HTTP API.
# BACKUP PAIRING: credential ciphertext lives in Postgres, the transit key
# material lives in OpenBao's storage — back up both together and restore
# OpenBao before anything that must decrypt. Losing the transit key loses every
# secret encrypted under it (credential metadata survives; re-enter secrets).
openbao:
  enabled: true
  image: openbao/openbao:2.6.1
  # -- REQUIRED when openbao.enabled: base64 of exactly 32 random bytes for the
  # static (KMS-free) auto-unseal (`openssl rand -base64 32`); not
  # auto-generated, for the same GitOps-render-stability reason as
  # postgresql.password. Changing it after first boot bricks the instance —
  # treat it like the data it seals, and keep it with your backups (it lives
  # here, not on the PVC; a restored instance cannot unseal without it).
  staticSealKey: ""
  # -- REQUIRED when openbao.enabled: the deterministic token the platform
  # authenticates with. The init sidecar mints it (orphan, periodic,
  # transit-scoped) and the chart injects it into the controlplane and executor
  # as BAO_TOKEN.
  platformToken: ""
  transitKey: map-secrets
  storage: 1Gi
  storageClassName: ""  # empty uses the cluster default StorageClass
  resources: {}
  # OpenBao listens on the standard 8200; not configurable for the bundled
  # instance, which serves plain HTTP inside the cluster like the bundled MinIO.

# -- External OpenBao/Vault transit endpoint, used when openbao.enabled is
# false. address is a full URL (scheme picks TLS, e.g. https://bao.internal:8200).
# The token needs update on transit/encrypt/<transitKey> and
# transit/decrypt/<transitKey>, plus create/read/update on
# transit/keys/<transitKey> — the platform POSTs that path at startup to
# ensure the key exists, and under Vault ACL semantics that POST needs
# update once the key does (the same grant the bundled init policy makes).
externalOpenBao:
  address: ""
  token: ""
  transitKey: map-secrets

# -- Fallback cipher when the bundled OpenBao is disabled and no external one is
# configured: AES-256-GCM under this base64 32-byte master key
# (`openssl rand -base64 32`), stored in the chart Secret. Minimal deployments
# only — no rotation story. Leaving masterKey empty too deploys without a
# cipher: the platform runs, vault credential storage is unavailable.
localCipher:
  masterKey: ""
  keyId: local-1

# -- Google Cloud KMS as the credential cipher — the production shape on GCP, and
# the fourth mutually-exclusive option beside the bundled OpenBao, an external
# OpenBao/Vault, and localCipher. Setting keyName selects it, and lets a GCP
# deployment turn the OpenBao StatefulSet off entirely: KMS needs a key resource
# name and nothing else, because authentication is Workload Identity rather than
# a token the chart would have to carry.
#
# The name is the full CryptoKey resource name,
# projects/P/locations/L/keyRings/R/cryptoKeys/K — a CryptoKey, not one of its
# versions, which the executor and control plane refuse at startup: Encrypt
# accepts a version name where Decrypt does not, so a deployment configured with
# one would seal credentials it could never unseal.
#
# It rides the chart Secret for uniformity with its siblings, not for
# confidentiality: a key resource name is not secret. What IS required and is
# NOT expressed here is the IAM half — the Kubernetes ServiceAccounts below must
# be bound to a Google service account holding
# roles/cloudkms.cryptoKeyEncrypterDecrypter on this key. See
# controlplane.serviceAccount.annotations and executor.serviceAccount.annotations.
#
# One behavioural consequence worth knowing before choosing it: Cloud KMS's raw
# Encrypt bounds plaintext where OpenBao's transit engine does not, so a vault
# credential whose sealed secrets exceed the bound is refused with a 400 naming
# the limit where another cipher would have stored it (docs/DIVERGENCES.md). The
# bound depends on the key — 65536 bytes for a software-protected one, 8192 for
# an HSM one — and the platform reads it from the key at startup, since a
# resource name does not say which you have. Real credential material sits orders
# of magnitude below either.
gcpKMS:
  keyName: ""

# -- Reference a pre-created Secret instead of letting the chart create one. When
# set, the chart creates NO Secret and every process reads credentials from this
# one, which must carry keys: controlplane-api-key, model-providers.json,
# database-url (plus the blob-* keys if object storage is in use, and the
# secrets-backend key if a credential cipher is in use, plus that backend's own:
# bao-* for OpenBao, secrets-* for the local cipher, gcpkms-key-name for Cloud
# KMS — see templates/_helpers.tpl map.secretsEnv). Incompatible with postgresql.enabled,
# minio.enabled, and openbao.enabled (bring your own backing services in this
# mode) — the chart fails the render otherwise.
existingSecret: ""
