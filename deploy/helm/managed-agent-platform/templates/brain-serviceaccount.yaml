{{/*
The brain needs no Kubernetes API permissions — like the control plane, and
unlike the executor, it never touches pods — so this ServiceAccount carries no
Role and no binding. It exists so the pod has an identity that can be
*annotated*, and the reason it has one at all is NOT the reason the other two do:
the brain holds no cipher and wants nothing from KMS. It opens the database, so
under the Cloud SQL Auth Proxy topology it needs a Google service account
holding roles/cloudsql.client (#269).

Its own, rather than the control plane's, because that one carries KMS decrypt —
and rather than the namespace's `default`, because annotating that would hand
whichever Google identity it names to every other pod in the namespace that also
defaults.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "map.fullname" . }}-brain
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: brain
  {{- with .Values.brain.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
