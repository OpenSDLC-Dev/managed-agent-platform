apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "map.fullname" . }}-executor
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.executor.replicas }}
  selector:
    matchLabels:
      {{- include "map.selectorLabels" (dict "ctx" . "component" "executor") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the chart-managed Secret (DSN) changes on upgrade.
        # Inert when existingSecret is set (no Secret is rendered).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
      labels:
        {{- include "map.labels" . | nindent 8 }}
        app.kubernetes.io/component: executor
    spec:
      serviceAccountName: {{ include "map.fullname" . }}-executor
      {{- include "map.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: executor
          image: {{ include "map.image" (dict "ctx" . "component" "executor") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/executor"]
          env:
            # SANDBOX_K8S_KUBECONFIG and _CONTEXT are intentionally unset so the
            # provider uses in-cluster config with the ServiceAccount above.
            - name: SANDBOX_BACKEND
              value: "k8s"
            - name: SANDBOX_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SANDBOX_K8S_NETSETUP_IMAGE
              value: {{ .Values.executor.netSetupImage | quote }}
            - name: EXECUTOR_IMAGE
              value: {{ .Values.executor.sandboxImage | quote }}
            - name: EXECUTOR_WORKDIR
              value: {{ .Values.executor.sandboxWorkdir | quote }}
            {{- with .Values.sandboxRuntimeClass.name }}
            - name: SANDBOX_K8S_RUNTIME_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- /* Sandbox containment (#65). Each is omitted when empty so the
                   executor's own default holds; an explicit value — including
                   "0" or "none" — is passed through verbatim. */}}
            {{- range $env, $value := dict
                  "SANDBOX_CPU_MILLIS" .Values.executor.sandboxHardening.cpuMillis
                  "SANDBOX_MEMORY_BYTES" .Values.executor.sandboxHardening.memoryBytes
                  "SANDBOX_EPHEMERAL_STORAGE_BYTES" .Values.executor.sandboxHardening.ephemeralStorageBytes
                  "SANDBOX_CAP_DROP" .Values.executor.sandboxHardening.capDrop
                  "SANDBOX_READONLY_ROOTFS" .Values.executor.sandboxHardening.readOnlyRootfs
                  "SANDBOX_RUN_AS_USER" .Values.executor.sandboxHardening.runAsUser }}
            {{- /* Only an unset value is skipped. `empty` would be the obvious
                   test and is the wrong one: it is true of the int 0 and of
                   false, so an operator writing an unquoted `cpuMillis: 0` to
                   turn a cap OFF would have that silently ignored and get the
                   executor's default instead. */}}
            {{- if not (or (kindIs "invalid" $value) (eq (toString $value) "")) }}
            - name: {{ $env }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.executor.leaseTTL }}
            - name: EXECUTOR_LEASE_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.executor.pollInterval }}
            - name: EXECUTOR_POLL_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.executor.gateImage }}
            {{- if semverCompare "<1.29-0" $.Capabilities.KubeVersion.Version }}
            {{- fail "executor.gateImage needs Kubernetes >= 1.29: the gate runs as a native sidecar (initContainer restartPolicy Always), which older kubelets reject" }}
            {{- end }}
            # Gate opt-in: both variables must be set (either alone keeps the
            # pre-gate fail-closed behavior), so the chart sets them together.
            - name: EXECUTOR_GATE_IMAGE
              value: {{ . | quote }}
            - name: CONTROLPLANE_URL
              value: {{ printf "http://%s-controlplane:%v" (include "map.fullname" $) $.Values.controlplane.service.port | quote }}
            {{- end }}
            {{- include "map.commonEnv" . | nindent 12 }}
            {{- include "map.blobEnv" . | nindent 12 }}
            {{- include "map.secretsEnv" . | nindent 12 }}
            {{- with .Values.executor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.executor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.executor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
