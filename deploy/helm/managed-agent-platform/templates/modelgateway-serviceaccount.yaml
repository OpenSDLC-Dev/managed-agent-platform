{{- if .Values.modelgateway.enabled }}
{{/*
The gateway needs no Kubernetes API permissions, so this ServiceAccount carries
no Role and no binding. It exists, like the control plane's, so the pod has an
identity of its own to annotate for GKE Workload Identity: the gcpKMS cipher
that seals and opens vendor keys, and the Cloud SQL Auth Proxy, authenticate
through it. Borrowing the control plane's would merge the two identities' IAM.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "map.fullname" . }}-modelgateway
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: modelgateway
  {{- with .Values.modelgateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
