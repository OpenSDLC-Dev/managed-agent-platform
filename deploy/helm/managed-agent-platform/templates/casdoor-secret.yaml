{{- if .Values.casdoor.enabled -}}
{{/*
Casdoor's database connection, and the only credential the bundle carries in a
Secret. Its own Secret rather than a key in the chart's: the chart Secret is not
rendered at all under `existingSecret`, and the bundled IdP is orthogonal to that
mode — an operator managing the platform's credentials by hand has no reason to
also hand-assemble Casdoor's DSN.

Casdoor takes a keyword/value DSN, not a URL. Two things about it are load-bearing
and a plausible guess gets both backwards:

  - `dbname=` must appear INSIDE the DSN. Postgres does not take the separate
    dbName key into the connection string, and refineDataSourceNameForPostgres
    rewrites `dbname=<x>` to `dbname=postgres` to reach the maintenance database
    for CREATE DATABASE — with no dbname= token that rewrite is a no-op and the
    create runs against the wrong database.
  - `host` must not be localhost: ReplaceDataSourceNameByDocker rewrites that to
    172.17.0.1, which inside a pod is nothing.
*/}}
{{- $dsn := .Values.casdoor.database.dataSourceName -}}
{{- if not $dsn -}}
{{- if not .Values.postgresql.enabled -}}
{{- fail "casdoor.database.dataSourceName is required when casdoor.enabled and postgresql.enabled is false: point the bundled IdP at your own Postgres with a keyword/value DSN — user=… password=… host=… port=5432 sslmode=… dbname=<casdoor.database.name> — whose role may CREATE DATABASE, or pre-create that database yourself." -}}
{{- end -}}
{{- $dsn = printf "user=%s password=%s host=%s-postgres port=5432 sslmode=disable dbname=%s" .Values.postgresql.username .Values.postgresql.password (include "map.fullname" .) .Values.casdoor.database.name -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "map.fullname" . }}-casdoor
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: casdoor
type: Opaque
data:
  datasource-name: {{ $dsn | b64enc | quote }}
{{- end -}}
