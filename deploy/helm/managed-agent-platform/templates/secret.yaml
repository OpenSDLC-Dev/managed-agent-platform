{{- if and .Values.existingSecret .Values.postgresql.enabled -}}
{{- fail "existingSecret is incompatible with postgresql.enabled: bring your own database (set postgresql.enabled=false) when managing the Secret yourself." -}}
{{- end -}}
{{- if and .Values.existingSecret .Values.minio.enabled -}}
{{- fail "existingSecret is incompatible with minio.enabled: bring your own object storage (set minio.enabled=false) when managing the Secret yourself." -}}
{{- end -}}
{{- if and .Values.existingSecret .Values.openbao.enabled -}}
{{- fail "existingSecret is incompatible with openbao.enabled: bring your own OpenBao/Vault (set openbao.enabled=false) when managing the Secret yourself." -}}
{{- end -}}
{{- /* Up here with the other existingSecret refusals, deliberately, and not with
       the object-storage guards below: everything past this point sits inside
       `if not .Values.existingSecret` and is skipped exactly when existingSecret
       is set — which is how the GCP mode this value exists for is deployed
       (docs/deploy-gcp.md), so a guard written down there would never fire for
       the deployments that need it. map.cloudSQLProxy's guards live in
       _helpers.tpl for the same reason.

       Refused rather than ignored, because silence here is expensive. With
       existingSecret the Secret is hand-assembled, so gcsObjectStorage selects
       nothing; an operator who sets it while migrating would read the successful
       render as "we are keyless now" while the pre-created Secret still carried
       blob-access-key and blob-secret-key — which map.blobEnv injects into all
       three pods, optional references and all. That is precisely the credential
       #240 deletes, still live, in the environment of processes that no longer
       use it. */ -}}
{{- if and .Values.existingSecret .Values.gcsObjectStorage.enabled -}}
{{- fail "existingSecret is incompatible with gcsObjectStorage.enabled: the chart writes no Secret in that mode, so this value would select nothing. Put blob-backend=gcs and blob-bucket in the pre-created Secret instead — and remove blob-endpoint/blob-access-key/blob-secret-key from it, or they keep being injected into every pod (#240)." -}}
{{- end -}}
{{- if not .Values.existingSecret -}}
{{- if not .Values.controlplane.apiKey -}}
{{- fail "controlplane.apiKey is required (or set existingSecret to reference a pre-created Secret)." -}}
{{- end -}}
{{- if not .Values.brain.modelProviders -}}
{{- fail "brain.modelProviders is required (or set existingSecret): provide at least one model route (a JSON array — see values.yaml)." -}}
{{- end -}}
{{/*
Resolve the Postgres password. It is required (not auto-generated): a generated
password is unstable under `helm template`/GitOps, where `lookup` can't read the
cluster and each render would emit a different value, so the apps' DSN would drift
from the initdb'd password and crash-loop. It is also embedded verbatim in the DSN
below, so it must be URL-safe.
*/}}
{{- $pgPassword := "" -}}
{{- if .Values.postgresql.enabled -}}
  {{- if not .Values.postgresql.password -}}
  {{- fail "postgresql.password is required when postgresql.enabled is true — the chart does not auto-generate it (a generated password is unstable under `helm template`/GitOps). Set a URL-safe value." -}}
  {{- end -}}
  {{- if regexMatch "[@:/?#% ]" .Values.postgresql.password -}}
  {{- fail "postgresql.password must be URL-safe: it is embedded in DATABASE_URL, so it may not contain @ : / ? # % or spaces. Choose a different password or percent-encode it and pass the encoded DSN via externalDatabase.url instead." -}}
  {{- end -}}
  {{- $pgPassword = .Values.postgresql.password -}}
{{- end -}}
{{/* Resolve the DSN ONCE: computed from the internal Postgres, or the external URL. */}}
{{- $dsn := "" -}}
{{- if .Values.postgresql.enabled -}}
  {{- $dsn = printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgresql.username $pgPassword (include "map.fullname" .) .Values.postgresql.database -}}
{{- else -}}
  {{- if not .Values.externalDatabase.url -}}
  {{- fail "externalDatabase.url is required when postgresql.enabled is false (or set existingSecret)." -}}
  {{- end -}}
  {{- $dsn = .Values.externalDatabase.url -}}
{{- end -}}
{{/*
Resolve object storage ONCE: the bundled MinIO, an external S3-compatible
endpoint, GCS natively, or none (no blob-* keys — the platform runs, skills
features are unavailable). More than one at once is ambiguous and fails the
render.

The GCS arm is the keyless one (#240): no endpoint and no credential, because it
authenticates with Application Default Credentials — Workload Identity on GKE,
which is an annotation on the ServiceAccounts, not a value a Secret can carry.
*/}}
{{- if and .Values.minio.enabled .Values.externalObjectStorage.endpoint -}}
{{- fail "minio.enabled and externalObjectStorage.endpoint are mutually exclusive: disable the bundled MinIO to use external object storage." -}}
{{- end -}}
{{- if and .Values.gcsObjectStorage.enabled .Values.minio.enabled -}}
{{- fail "gcsObjectStorage.enabled and minio.enabled are mutually exclusive: disable the bundled MinIO to use Google Cloud Storage." -}}
{{- end -}}
{{- if and .Values.gcsObjectStorage.enabled .Values.externalObjectStorage.endpoint -}}
{{- fail "gcsObjectStorage.enabled and externalObjectStorage.endpoint are mutually exclusive: the GCS backend speaks to Google directly and takes no endpoint. Reaching GCS over its S3-interop API instead is the externalObjectStorage path, and it costs an HMAC key pair (#240)." -}}
{{- end -}}
{{- $blobBackend := "" -}}
{{- $blobEndpoint := "" -}}
{{- $blobAccessKey := "" -}}
{{- $blobSecretKey := "" -}}
{{- $blobBucket := "" -}}
{{- $blobRegion := "" -}}
{{- $blobTLS := "false" -}}
{{- $blobBucketPrecreated := "false" -}}
{{- if .Values.minio.enabled -}}
  {{- if or (not .Values.minio.rootUser) (not .Values.minio.rootPassword) -}}
  {{- fail "minio.rootUser and minio.rootPassword are required when minio.enabled is true — the chart does not auto-generate them (a generated credential is unstable under `helm template`/GitOps). MinIO requires a rootPassword of at least 8 characters." -}}
  {{- end -}}
  {{- $blobEndpoint = printf "%s-minio:9000" (include "map.fullname" .) -}}
  {{- $blobAccessKey = .Values.minio.rootUser -}}
  {{- $blobSecretKey = .Values.minio.rootPassword -}}
  {{- $blobBucket = .Values.minio.bucket -}}
{{- else if .Values.externalObjectStorage.endpoint -}}
  {{- if or (not .Values.externalObjectStorage.accessKey) (not .Values.externalObjectStorage.secretKey) (not .Values.externalObjectStorage.bucket) -}}
  {{- fail "externalObjectStorage requires accessKey, secretKey, and bucket alongside endpoint." -}}
  {{- end -}}
  {{- if and .Values.externalObjectStorage.bucketPrecreated (not .Values.externalObjectStorage.region) -}}
  {{- fail "externalObjectStorage.bucketPrecreated requires region: without one the client resolves the bucket's location before its first object request, which needs the bucket-level read the setting exists to stop needing (#241)." -}}
  {{- end -}}
  {{- $blobEndpoint = .Values.externalObjectStorage.endpoint -}}
  {{- $blobAccessKey = .Values.externalObjectStorage.accessKey -}}
  {{- $blobSecretKey = .Values.externalObjectStorage.secretKey -}}
  {{- $blobBucket = .Values.externalObjectStorage.bucket -}}
  {{- $blobRegion = .Values.externalObjectStorage.region -}}
  {{- $blobTLS = ternary "true" "false" .Values.externalObjectStorage.tls -}}
  {{- $blobBucketPrecreated = ternary "true" "false" .Values.externalObjectStorage.bucketPrecreated -}}
{{- else if .Values.gcsObjectStorage.enabled -}}
  {{- if not .Values.gcsObjectStorage.bucket -}}
  {{- fail "gcsObjectStorage.enabled requires bucket: the bucket name is the whole configuration of the GCS backend, and it must already exist — nothing creates or checks it, which is what keeps the identity's grant to object permissions only (#240)." -}}
  {{- end -}}
  {{- $blobBackend = "gcs" -}}
  {{- $blobBucket = .Values.gcsObjectStorage.bucket -}}
{{- end -}}
{{/*
Resolve the credential cipher ONCE (docs/plan/12_vaults-credentials.md, D2): the
bundled OpenBao, an external OpenBao/Vault, the local AES-GCM fallback, or none
(no secrets-* keys — the platform runs, vault credential storage is
unavailable). More than one at once is ambiguous and fails the render.
*/}}
{{- if and .Values.openbao.enabled .Values.externalOpenBao.address -}}
{{- fail "openbao.enabled and externalOpenBao.address are mutually exclusive: disable the bundled OpenBao to use an external one." -}}
{{- end -}}
{{- if and (or .Values.openbao.enabled .Values.externalOpenBao.address) .Values.localCipher.masterKey -}}
{{- fail "localCipher.masterKey is the fallback for when neither the bundled OpenBao nor externalOpenBao is configured — unset it (or disable the OpenBao options) to resolve the ambiguity." -}}
{{- end -}}
{{- if and .Values.gcpKMS.keyName (or .Values.openbao.enabled .Values.externalOpenBao.address .Values.localCipher.masterKey) -}}
{{- fail "gcpKMS.keyName selects Cloud KMS as the credential cipher and is exclusive with the OpenBao options and localCipher.masterKey — unset the others (on GCP, that usually means openbao.enabled=false) to resolve the ambiguity." -}}
{{- end -}}
{{- $secretsBackend := "" -}}
{{- $baoAddr := "" -}}
{{- $baoToken := "" -}}
{{- $baoTransitKey := "" -}}
{{- if .Values.openbao.enabled -}}
  {{- if or (not .Values.openbao.staticSealKey) (not .Values.openbao.platformToken) -}}
  {{- fail "openbao.staticSealKey and openbao.platformToken are required when openbao.enabled is true — the chart does not auto-generate them (a generated credential is unstable under `helm template`/GitOps). staticSealKey is base64 of exactly 32 random bytes (`openssl rand -base64 32`)." -}}
  {{- end -}}
  {{- if ne (len (b64dec .Values.openbao.staticSealKey)) 32 -}}
  {{- fail "openbao.staticSealKey must be base64 of exactly 32 bytes (`openssl rand -base64 32`) — the static seal rejects any other length." -}}
  {{- end -}}
  {{- $secretsBackend = "openbao" -}}
  {{- $baoAddr = printf "http://%s-openbao:8200" (include "map.fullname" .) -}}
  {{- $baoToken = .Values.openbao.platformToken -}}
  {{- $baoTransitKey = .Values.openbao.transitKey -}}
{{- else if .Values.externalOpenBao.address -}}
  {{- if not .Values.externalOpenBao.token -}}
  {{- fail "externalOpenBao requires token alongside address." -}}
  {{- end -}}
  {{- $secretsBackend = "openbao" -}}
  {{- $baoAddr = .Values.externalOpenBao.address -}}
  {{- $baoToken = .Values.externalOpenBao.token -}}
  {{- $baoTransitKey = .Values.externalOpenBao.transitKey -}}
{{- else if .Values.localCipher.masterKey -}}
  {{- if ne (len (b64dec .Values.localCipher.masterKey)) 32 -}}
  {{- fail "localCipher.masterKey must be base64 of exactly 32 bytes (`openssl rand -base64 32`) — AES-256-GCM rejects any other length." -}}
  {{- end -}}
  {{- $secretsBackend = "local" -}}
{{- else if .Values.gcpKMS.keyName -}}
  {{- /* A CryptoKey, not one of its versions: Encrypt accepts a version name
        where Decrypt does not, so a release configured with one would seal
        credentials it could never unseal. The processes refuse it at startup;
        refusing at render time means the operator never deploys it at all.
        There is no credential to resolve beside it — authentication is
        Workload Identity, which is an annotation on the ServiceAccounts, not
        a value the Secret can carry.

        The expression is character-for-character the executor's own
        (internal/secrets/gcpkms's keyNameRE), and a Go test feeds the same
        literals to both so the two cannot drift. */}}
  {{- if not (regexMatch "^projects/[^/]+/locations/[^/]+/keyRings/[a-zA-Z0-9_-]{1,63}/cryptoKeys/[a-zA-Z0-9_-]{1,63}$" .Values.gcpKMS.keyName) -}}
  {{- fail (printf "gcpKMS.keyName must be a full CryptoKey resource name (projects/P/locations/L/keyRings/R/cryptoKeys/K), not %q — a CryptoKeyVersion is not accepted, because Decrypt refuses one." .Values.gcpKMS.keyName) -}}
  {{- end -}}
  {{- $secretsBackend = "gcpkms" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "map.fullname" . }}
  labels:
    {{- include "map.labels" . | nindent 4 }}
type: Opaque
data:
  controlplane-api-key: {{ .Values.controlplane.apiKey | b64enc | quote }}
  model-providers.json: {{ .Values.brain.modelProviders | toJson | b64enc | quote }}
  database-url: {{ $dsn | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ $pgPassword | b64enc | quote }}
  {{- end }}
  {{- /*
  The GCS arm emits exactly two keys. The S3 ones are not merely unused there —
  BLOB_ACCESS_KEY and BLOB_SECRET_KEY are credentials, and a Secret carrying
  credentials the deployment cannot use is the thing #240 set out to delete.
  internal/blob/backend warns when it finds them alongside BLOB_BACKEND=gcs.
  */}}
  {{- if eq $blobBackend "gcs" }}
  blob-backend: {{ $blobBackend | b64enc | quote }}
  blob-bucket: {{ $blobBucket | b64enc | quote }}
  {{- else if $blobEndpoint }}
  blob-endpoint: {{ $blobEndpoint | b64enc | quote }}
  blob-access-key: {{ $blobAccessKey | b64enc | quote }}
  blob-secret-key: {{ $blobSecretKey | b64enc | quote }}
  blob-bucket: {{ $blobBucket | b64enc | quote }}
  blob-region: {{ $blobRegion | b64enc | quote }}
  blob-tls: {{ $blobTLS | b64enc | quote }}
  blob-bucket-precreated: {{ $blobBucketPrecreated | b64enc | quote }}
  {{- end }}
  {{- if eq $secretsBackend "openbao" }}
  secrets-backend: {{ "openbao" | b64enc | quote }}
  bao-addr: {{ $baoAddr | b64enc | quote }}
  bao-token: {{ $baoToken | b64enc | quote }}
  bao-transit-key: {{ $baoTransitKey | b64enc | quote }}
  {{- if .Values.openbao.enabled }}
  {{- /* Consumed by the bundled StatefulSet, never by the app processes. The
        value is itself base64 (the static seal's env:// contract), so it is
        encoded a second time here like every Secret datum. */}}
  bao-static-key: {{ .Values.openbao.staticSealKey | b64enc | quote }}
  {{- end }}
  {{- else if eq $secretsBackend "local" }}
  secrets-backend: {{ "local" | b64enc | quote }}
  secrets-master-key: {{ .Values.localCipher.masterKey | b64enc | quote }}
  secrets-key-id: {{ .Values.localCipher.keyId | b64enc | quote }}
  {{- else if eq $secretsBackend "gcpkms" }}
  secrets-backend: {{ "gcpkms" | b64enc | quote }}
  {{- /* Not secret — it rides the Secret for uniformity with its siblings, so
        map.secretsEnv stays one uniform block instead of gaining a special
        case for the one backend whose configuration happens to be public. */}}
  gcpkms-key-name: {{ .Values.gcpKMS.keyName | b64enc | quote }}
  {{- end }}
{{- end -}}
