{{/*
The executor launches, execs into, and tears down one sandbox Pod per session in
its own namespace via in-cluster config, so its ServiceAccount needs exactly the
pod lifecycle + exec verbs the Kubernetes sandbox provider calls — nothing cluster
-wide. A namespaced Role keeps the blast radius to this release's namespace.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "map.fullname" . }}-executor
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
  {{- /* GKE Workload Identity is an annotation and nothing else — this is how
        the gcpKMS cipher authenticates from the executor. The executor builds
        the cipher only to fail fast on a misconfigured backend and then
        discards it: vault credentials are decrypted control-plane side, at the
        gate-config endpoint, never here. So the one KMS call this identity ever
        makes is the startup probe's encrypt, and roles/cloudkms.cryptoKeyEncrypter
        is enough for it — see values.yaml. */}}
  {{- with .Values.executor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "map.fullname" . }}-executor
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
rules:
  # The provider polls pod readiness with repeated Get (not Watch), and the
  # reaper's Owned/Reap enumerate owned pods by label selector (plan 24), so the
  # verbs are exactly create / get / list / delete on pods and create on
  # pods/exec.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "map.fullname" . }}-executor
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "map.fullname" . }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "map.fullname" . }}-executor
    namespace: {{ .Release.Namespace }}
