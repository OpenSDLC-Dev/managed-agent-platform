{{- if (.Values.modelgateway | default dict).enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "map.fullname" . }}-modelgateway
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: modelgateway
spec:
  type: {{ .Values.modelgateway.service.type }}
  selector:
    {{- include "map.selectorLabels" (dict "ctx" . "component" "modelgateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.modelgateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
