{{/*
The control plane needs no Kubernetes API permissions at all — unlike the
executor, it never touches pods — so this ServiceAccount carries no Role and no
binding. It exists so the pod has an identity that can be *annotated*: GKE
Workload Identity binds a Google service account to a named KSA, and that is how
the gcpKMS cipher authenticates with no key material anywhere in the release.

Without it the pod would run as the namespace's `default` KSA, and annotating
that would hand the same Google identity to every other pod in the namespace
that also defaults — the per-session sandbox pods among them, which set no
ServiceAccountName of their own and run untrusted, model-directed code.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "map.fullname" . }}-controlplane
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
  {{- with .Values.controlplane.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
