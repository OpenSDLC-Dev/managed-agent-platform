{{- /* With the gateway on, the brain's one route is the gateway's
       (brain-configmap.yaml), so routes of its own would be dropped without a
       word; refused instead, here rather than in secret.yaml so that an
       existingSecret release is refused too. */}}
{{- $gateway := (.Values.modelgateway | default dict).enabled }}
{{- if and $gateway .Values.brain.modelProviders }}
{{- fail "brain.modelProviders is set, but modelgateway.enabled routes the brain through the model gateway: configure those vendors in the gateway's catalogue, or set modelgateway.enabled=false to keep these routes." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "map.fullname" . }}-brain
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: brain
spec:
  replicas: {{ .Values.brain.replicas }}
  selector:
    matchLabels:
      {{- include "map.selectorLabels" (dict "ctx" . "component" "brain") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the chart-managed Secret (DSN, model providers or
        # the brain's key) changes on upgrade. Inert when existingSecret is set
        # (no Secret is rendered).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
        {{- if $gateway }}
        # And when the gateway route does: its Service's port is in it.
        checksum/routes: {{ include (print $.Template.BasePath "/brain-configmap.yaml") . | sha256sum | quote }}
        {{- end }}
      labels:
        {{- include "map.labels" . | nindent 8 }}
        app.kubernetes.io/component: brain
    spec:
      serviceAccountName: {{ include "map.fullname" . }}-brain
      {{- include "map.imagePullSecrets" . | nindent 6 }}
      {{- include "map.cloudSQLProxy" . | nindent 6 }}
      containers:
        - name: brain
          image: {{ include "map.image" (dict "ctx" . "component" "brain") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/brain"]
          env:
            - name: MODEL_PROVIDERS_PATH
              value: /etc/managed-agent-platform/model-providers.json
            {{- include "map.brainKeyEnv" . | nindent 12 }}
            {{- with .Values.brain.leaseTTL }}
            - name: BRAIN_LEASE_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.brain.pollInterval }}
            - name: BRAIN_POLL_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- include "map.commonEnv" . | nindent 12 }}
            {{- include "map.blobEnv" . | nindent 12 }}
          volumeMounts:
            - name: model-providers
              mountPath: /etc/managed-agent-platform
              readOnly: true
          {{- with .Values.brain.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: model-providers
          {{- if $gateway }}
          configMap:
            name: {{ include "map.fullname" . }}-brain-routes
            items:
              - key: model-providers.json
                path: model-providers.json
          {{- else }}
          secret:
            secretName: {{ include "map.secretName" . }}
            # optional so a missing key surfaces as a clear brain error ("model
            # providers config: no such file") instead of the pod wedging in
            # ContainerCreating — relevant only in the existingSecret path.
            optional: true
            items:
              - key: model-providers.json
                path: model-providers.json
          {{- end }}
      {{- with .Values.brain.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.brain.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.brain.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
