{{- /* A default dict rather than .Values.modelgateway.enabled, here and in
       the other modelgateway templates and NOTES.txt: a release upgraded with
       --reuse-values from a chart without the section has none, and reading a
       field of the nil would fail the whole render with the gateway off. Not
       dig, which Helm 4 refuses on .Values. */}}
{{- if (.Values.modelgateway | default dict).enabled }}
{{- /* The gateway seals vendor keys with the release's credential cipher and
       refuses to start without one, so a chart-managed Secret that resolves
       none fails here instead of crash-looping. An existingSecret is the
       operator's to fill: the chart cannot see whether it carries the
       secrets-* keys, and the gateway names the missing variable at startup. */}}
{{- if and (not .Values.existingSecret) (not (include "map.secretsBackend" .)) }}
{{- fail "modelgateway.enabled needs a credential cipher — openbao.enabled, externalOpenBao.address, localCipher.masterKey or gcpKMS.keyName: the gateway seals vendor keys with it and does not start without one." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "map.fullname" . }}-modelgateway
  labels:
    {{- include "map.labels" . | nindent 4 }}
    app.kubernetes.io/component: modelgateway
spec:
  replicas: {{ .Values.modelgateway.replicas }}
  selector:
    matchLabels:
      {{- include "map.selectorLabels" (dict "ctx" . "component" "modelgateway") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the chart-managed Secret changes on upgrade, as the
        # control plane's do. Inert when existingSecret is set.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
      labels:
        {{- include "map.labels" . | nindent 8 }}
        app.kubernetes.io/component: modelgateway
    spec:
      terminationGracePeriodSeconds: {{ .Values.modelgateway.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "map.fullname" . }}-modelgateway
      # A soft spread: the scheduler prefers to put the replicas on different
      # nodes, so losing one need not take every gateway, and never refuses to
      # schedule one, so a one-node cluster (or a nodeSelector naming one node)
      # still runs them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "map.selectorLabels" (dict "ctx" . "component" "modelgateway") | nindent 14 }}
      {{- include "map.imagePullSecrets" . | nindent 6 }}
      {{- include "map.cloudSQLProxy" . | nindent 6 }}
      containers:
        - name: modelgateway
          image: {{ include "map.image" (dict "ctx" . "component" "modelgateway") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/modelgateway"]
          ports:
            - name: http
              containerPort: {{ .Values.modelgateway.service.port }}
          env:
            - name: MODELGATEWAY_ADDR
              value: ":{{ .Values.modelgateway.service.port }}"
            - name: CONTROLPLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "map.secretName" . }}
                  key: controlplane-api-key
            {{- include "map.brainKeyEnv" . | nindent 12 }}
            {{- include "map.commonEnv" . | nindent 12 }}
            {{- include "map.secretsEnv" . | nindent 12 }}
            {{- include "map.identityEnv" . | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.modelgateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.modelgateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.modelgateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.modelgateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
